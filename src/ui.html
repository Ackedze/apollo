        function parseCustomizationDiffMessage(message) {
          if (typeof message !== 'string') {
            return null;
          }

          const trimmed = message.trim();
          if (!trimmed) {
            return null;
          }

          const separatorIndex = trimmed.indexOf(':');
          if (separatorIndex === -1) {
            return {
              label: 'Изменение',
              values: [trimmed],
            };
          }

          const rawLabel = trimmed.slice(0, separatorIndex).trim();
          const rawValue = trimmed.slice(separatorIndex + 1).trim();

          if (!rawValue) {
            return {
              label: rawLabel || 'Изменение',
              values: ['—'],
            };
          }

          const parts = rawValue
            .split('→')
            .map((part) => part.trim())
            .filter(Boolean);

          return {
            label: rawLabel || 'Изменение',
            values: parts.length ? parts : [rawValue],
          };
        }

        function getCustomizationDetailDisplayValue(detail) {
          if (!detail || typeof detail !== 'object') {
            return null;
          }

          const candidates = [
            detail.displayName,
            detail.binding && detail.binding.name,
            detail.resource && detail.resource.name,
            detail.value,
          ];
          for (const candidate of candidates) {
            if (typeof candidate === 'number') {
              return String(candidate);
            }
            if (typeof candidate === 'string' && candidate.trim()) {
              return candidate.trim();
            }
          }
          return null;
        }

        function getCustomizationStructuredValues(diff) {
          const details = diff && diff.details;
          if (!details || !details.reference || !details.actual) {
            return null;
          }

          return [
            getCustomizationDetailDisplayValue(details.reference) || '—',
            getCustomizationDetailDisplayValue(details.actual) || '—',
          ];
        }

        function renderCustomizationReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items
            .map((item) => {
              const diffs = prepareChangeDiffs(item);
              if (!diffs.length) {
                return null;
              }

              const groupsMap = new Map();
              diffs.forEach((diff, index) => {
                const groupId =
                  diff.nodeId ||
                  diff.nodePath ||
                  diff.nodeName ||
                  `${item.id}:diff:${index}`;
                const existing = groupsMap.get(groupId);
                const parsed = parseCustomizationDiffMessage(diff.message);
                const structuredValues = getCustomizationStructuredValues(diff);
                const isVariantDiff =
                  typeof diff.details?.property === 'string' &&
                  diff.details.property.indexOf('variant.') === 0;
                const isBindingDiff =
                  typeof diff.details?.bindingStatus === 'string' ||
                  Boolean(diff.details?.variableMode);
                const marker =
                  !isVariantDiff &&
                  (diff.assessment?.verdict === 'expected' ||
                    diff.assessment?.verdict === 'allowed')
                    ? 'Expected'
                    : undefined;
                const line = parsed
                  ? {
                      ...parsed,
                      values: structuredValues || parsed.values,
                      marker,
                    }
                  : {
                      label: 'Изменение',
                      values:
                        structuredValues || [(diff.message || '').trim() || '—'],
                      marker,
                    };
                const canReset =
                  diff.assessment?.verdict !== 'expected' &&
                  diff.assessment?.verdict !== 'allowed';
                let remediation = diff.assessment?.remediation;
                if (!remediation && canReset && isVariantDiff && diff.nodeId) {
                  const property = diff.details?.property?.slice('variant.'.length);
                  const referenceValue = diff.details?.reference?.value;
                  if (
                    property &&
                    typeof referenceValue === 'string' &&
                    referenceValue.length
                  ) {
                    remediation = {
                      kind: 'set-variant-properties',
                      nodeId: diff.nodeId,
                      properties: {
                        [property]: referenceValue,
                      },
                    };
                  }
                }
                const resetDetail =
                  canReset && !remediation && diff.details
                    ? {
                        property: diff.details.property,
                        reference: diff.details.reference,
                        message: diff.message,
                      }
                    : null;

                if (existing) {
                  const sectionLines = isVariantDiff
                    ? existing.componentLines
                    : isBindingDiff
                      ? existing.bindingLines
                      : existing.layerLines;
                  sectionLines.push(line);
                  if (resetDetail) {
                    existing.details.push(resetDetail);
                  } else if (canReset && !remediation) {
                    existing.messages.push(diff.message);
                  }
                  if (
                    remediation &&
                    !existing.remediations.some(
                      (item) =>
                        item.kind === remediation.kind &&
                        item.nodeId === remediation.nodeId &&
                        JSON.stringify(item.properties) ===
                          JSON.stringify(remediation.properties),
                    )
                  ) {
                    existing.remediations.push(remediation);
                  }
                  return;
                }

                const group = {
                  id: groupId,
                  name: diff.nodeName || diff.nodePath || 'Слой',
                  nodePath: diff.nodePath || '',
                  order: groupsMap.size,
                  onFocus: diff.nodeId
                    ? () => focusNodeById(diff.nodeId)
                    : undefined,
                  nodeId: diff.nodeId,
                  componentLines: isVariantDiff ? [line] : [],
                  bindingLines:
                    !isVariantDiff && isBindingDiff ? [line] : [],
                  layerLines:
                    !isVariantDiff && !isBindingDiff ? [line] : [],
                  messages:
                    canReset && !remediation && !resetDetail ? [diff.message] : [],
                  details: resetDetail ? [resetDetail] : [],
                  remediations: remediation ? [remediation] : [],
                };

                groupsMap.set(groupId, group);
              });

              const groups = sortCustomizationGroupsByPath(Array.from(groupsMap.values()))
                .map((group) => ({
                  id: group.id,
                  name: group.name,
                  onFocus: group.onFocus,
                  lines: [
                    ...(group.componentLines.length
                      ? [
                          {
                            label: 'Параметры компонента',
                            values: [],
                          },
                          ...group.componentLines,
                        ]
                      : []),
                    ...(group.bindingLines.length
                      ? [
                          {
                            label: 'Переменные',
                            values: [],
                          },
                          ...group.bindingLines,
                        ]
                      : []),
                    ...(group.layerLines.length
                      ? [
                          {
                            label: 'Параметры слоя',
                            values: [],
                          },
                          ...group.layerLines,
                        ]
                      : []),
                  ],
                  actions: buildCustomizationResetActions(item.id, group),
                  onReset:
                    (group.messages.length ||
                      group.details.length ||
                      group.remediations.length) &&
                    group.nodeId
                      ? () =>
                          requestCustomizationReset(
                            item.id,
                            group.nodeId,
                            group.messages,
                            group.details,
                            group.remediations,
                          )
                      : undefined,
                }));
              if (!groups.length) {
                return null;
              }

              return {
                kind: 'customization',
                id: item.id,
                title: item.name ?? 'Без названия',
                caption: getItemLibraryName(item) ?? undefined,
                groups,
              };
            })
            .filter(Boolean);

          if (!reactItems.length) {
            return false;
          }

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function shouldUseAuditReactResults(tabId) {
          return (
            tabId === 'current' ||
            tabId === 'technical' ||
            tabId === 'deprecated' ||
            tabId === 'wrongChannel' ||
            tabId === 'update' ||
            tabId === 'presets' ||
            tabId === 'local'
          );
        }

        const TECHNICAL_DIFF_PATTERN = /(Token\s)|(token:)|(VariableID:)/i;

        function isTechnicalDiff(diff) {
          if (!diff || typeof diff.message !== 'string') return false;
          return TECHNICAL_DIFF_PATTERN.test(diff.message);
        }

        function getDiffKey(diff) {
          return (
            diff.nodeId ??
            diff.nodePath ??
            diff.nodeName ??
            String(diff.message ?? 'diff')
          );
        }

        function dedupeDiffs(diffs) {
          const seen = new Map();
          const normalized = [];
          for (const diff of diffs) {
            const key = getDiffKey(diff);
            const currentIsTech = isTechnicalDiff(diff);
            const existing = seen.get(key);
            if (existing) {
              const existingIsTech = isTechnicalDiff(existing.diff);
              if (!currentIsTech && existingIsTech) {
                normalized[existing.index] = diff;
                seen.set(key, { diff, index: existing.index });
                continue;
              }
              if (currentIsTech) {
                continue;
              }
            }
            const index = normalized.length;
            normalized.push(diff);
            seen.set(key, { diff, index });
          }
          return normalized;
        }

        /**
         * Убирает скрытые diff-ы и технические строки, оставляя человекочитаемые записи
         * для таба «Кастомизация» и рендерингового конца.
         */
        function prepareChangeDiffs(item) {
          const rawDiffs = Array.isArray(item.diffs) ? item.diffs : [];

          return dedupeDiffs(rawDiffs);
        }

        function setScanningState(active) {
          isScanning = active;
          actionPhase = active ? 'scanning' : getIdleActionPhase();
          refreshScanButton();
          updateLoaderVisibility();
        }

        function getIdleActionPhase() {
          if (catalogsLoading || !catalogsReady) {
            return 'catalog-loading';
          }
          return 'idle';
        }

        function getItemLibraryName(item) {
          if (item.librarySource) {
            return item.librarySource;
          }
          if (item.reference) {
            return item.reference.source ?? 'Дизайн-система';
          }
          if (item.isLocal) {
            return 'Локальный';
          }
          return null;
        }

        function getAuditItemCaption(item) {
          const libraryName = getItemLibraryName(item);
          const updateReasons = Array.isArray(item.updateReasons)
            ? item.updateReasons
            : [];
          if (updateReasons.includes('library-update-available')) {
            const ownerName = item.localComponentOwner?.name;
            const freshnessCaption = libraryName
              ? `Доступна новая версия · ${libraryName}`
              : 'Доступна новая версия';
            return ownerName
              ? `${freshnessCaption} · внутри ${ownerName}`
              : freshnessCaption;
          }
          return libraryName;
        }

        function formatCustomStyleReason(reason) {
          if (reason.startsWith('effect:')) {
            return reason.split(':')[1];
          }
          switch (reason) {
            case 'fill':
              return 'Заливка';
            case 'stroke':
              return 'Обводка';
            case 'style':
              return 'Стили';
            default:
              return 'Стиль';
          }
        }

        function formatDeprecatedStyleReason(reason) {
          switch (reason) {
            case 'fill':
              return 'Заливка';
            case 'stroke':
              return 'Обводка';
            default:
              return 'Стиль';
          }
        }

        function formatDeprecatedStyleSource(sourceFile) {
          if (!sourceFile) {
            return 'Unknown style catalog';
          }

          return sourceFile
            .replace(/^styles\//i, '')
            .replace(/\.json$/i, '');
        }

        function groupDeprecatedStyleEntries(items) {
          const groups = new Map();

          for (const entry of items) {
            const key = [
              entry.styleLabel || '',
              entry.sourceFile || '',
            ].join('|');

            if (!groups.has(key)) {
              groups.set(key, {
                id: key || entry.id,
                styleLabel: entry.styleLabel || 'Unknown style',
                sourceFile: entry.sourceFile || 'Unknown style catalog',
                sourceLibrary:
                  entry.sourceLibrary ||
                  entry.sourceFile ||
                  'Unknown style catalog',
                usages: [],
              });
            }

            groups.get(key).usages.push(entry);
          }

          return Array.from(groups.values());
        }

        window.onmessage = (event) => {
          const msg = event.data?.pluginMessage;
          if (!msg) return;

          if (msg.type === 'tab-config') {
            initializeTabConfig(msg.payload);
            return;
          }

          if (msg.type === 'scan-started') {
            listContainer.innerHTML = '';
            setScanningState(true);
            scanCompleted = false;
            agentReportMeta = null;
            agentRequestInProgress = false;
            agentActiveRequestId = null;
            agentActiveRequestKind = null;
            agentReportMessages = [];
            activeApolloView = 'audit';
            if (agentComposerInput) {
              agentComposerInput.value = '';
              resizeAgentComposerInput();
            }
            syncAgentViewState();
            renderAgentMessages();
          }

          if (msg.type === 'scan-finished') {
            setScanningState(false);
            return;
          }

          if (msg.type === 'scan-cancelled') {
            setScanningState(false);
            showToast('Проверка остановлена');
            if (currentResults) {
              renderList();
            } else if (listContainer) {
              listContainer.innerHTML =
                '<div class="placeholder">Проверка остановлена.</div>';
            }
            return;
          }

          if (msg.type === 'scan-result') {
            currentResults = msg.payload;
            scanCompleted = true;
            syncAgentViewState();
            updateActiveTabClasses();
            renderList();
            showToast(
              `Проверено компонентов: ${currentResults.summary.totalTargets}`,
            );
            return;
          }

          if (msg.type === 'scan-error') {
            actionPhase = getIdleActionPhase();
            showToast(msg.payload?.message ?? 'Не удалось выполнить проверку');
            scanCompleted = false;
            agentReportMeta = null;
            activeApolloView = 'audit';
            syncAgentViewState();
            return;
          }

          if (msg.type === 'generation-example-started') {
            showToast('Собираем пример…');
            return;
          }

          if (msg.type === 'generation-example-ready') {
            downloadJsonDocument(
              msg.payload?.document,
              msg.payload?.suggestedFileName,
            );
            const warningCount = Number(msg.payload?.warningCount || 0);
            showToast(
              warningCount > 0
                ? `Пример собран · предупреждений: ${warningCount}`
                : 'Пример собран',
            );
            return;
          }

          if (msg.type === 'generation-example-error') {
            showToast(msg.payload?.message ?? 'Не удалось собрать пример');
            return;
          }

          if (msg.type === 'apollo-agent-report-ready') {
            agentReportMeta = msg.payload || null;
            syncAgentViewState();
            return;
          }

          if (msg.type === 'apollo-agent-started') {
            handleAgentStarted(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-result') {
            handleAgentResult(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-cancelled') {
            const cancelledKind = agentActiveRequestKind || 'report';
            agentRequestInProgress = false;
            agentActiveRequestId = null;
            agentActiveRequestKind = null;
            removeAgentLoadingMessage(cancelledKind);
            syncAgentViewState();
            return;
          }

          if (msg.type === 'catalog-file-loaded') {
            handleCatalogFileLoaded(msg.payload);
          }

          if (msg.type === 'catalog-loading') {
            catalogsLoading = true;
            catalogsReady = false;
            if (!isScanning) {
              actionPhase = 'catalog-loading';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showCatalogToast('Загрузка…');
          }

          if (msg.type === 'catalog-ready') {
            catalogsLoading = false;
            catalogsReady = true;
            if (!isScanning) {
              actionPhase = 'idle';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showCatalogToast('Готово');
          }

          if (msg.type === 'catalog-error') {
            catalogsLoading = false;
            catalogsReady = false;
            if (!isScanning) {
              actionPhase = 'catalog-loading';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showCatalogToast(
              msg.payload?.message ?? 'Не удалось загрузить справочники',
            );
          }
        };

        function showToast(message) {
          if (!toastEl) return;
          toastEl.textContent = message;
          toastEl.classList.add('visible');
          setTimeout(() => {
            toastEl?.classList.remove('visible');
          }, 3000);
        }

        function downloadJsonDocument(payloadDocument, suggestedFileName) {
          if (!payloadDocument) {
            showToast('Apollo не вернул данные примера');
            return;
          }
          const fileName =
            typeof suggestedFileName === 'string' && suggestedFileName.trim()
              ? suggestedFileName.trim()
              : 'apollo.generation-example-candidate.json';
          const blob = new Blob(
            [JSON.stringify(payloadDocument, null, 2)],
            { type: 'application/json;charset=utf-8' },
          );
          const objectUrl = URL.createObjectURL(blob);
          const anchor = document.createElement('a');
          anchor.href = objectUrl;
          anchor.download = fileName;
          anchor.style.display = 'none';
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          window.setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
        }

        function showCatalogToast(message) {
          showToast(truncateToastText(message, 16));
        }

        function truncateToastText(value, maxLength) {
          const text = String(value ?? '').trim();
          if (text.length <= maxLength) {
            return text;
          }
          return `${text.slice(0, Math.max(0, maxLength - 1))}…`;
        }

        function setActiveApolloView(nextView) {
          if (
            nextView !== 'audit' &&
            nextView !== 'report' &&
            nextView !== 'dialogue'
          ) {
            return;
          }

          activeApolloView = nextView;
          renderAgentMessages();
          syncAgentViewState();
        }

        function retryActiveAgentRequest() {
          if (agentRequestInProgress) {
            return;
          }

          if (activeApolloView === 'report') {
            if (agentReportMeta) {
              sendAgentReportToProxy();
            }
            return;
          }

          if (activeApolloView === 'dialogue' && agentLastQuestion) {
            sendAgentReportToProxy(agentLastQuestion);
          }
        }

        function handleAgentComposerSubmit(event) {
          event?.preventDefault?.();

          if (activeApolloView !== 'dialogue') {
            return;
          }

          if (agentRequestInProgress) {
            if (agentActiveRequestKind === 'question') {
              cancelAgentReportRequest();
            }
            return;
          }

          const userMessage = agentComposerInput?.value?.trim() || '';
          if (!userMessage) {
            return;
          }

          agentLastQuestion = userMessage;
          addAgentMessage({
            role: 'user',
            text: userMessage,
          }, 'question');

          if (agentComposerInput) {
            agentComposerInput.value = '';
            resizeAgentComposerInput();
          }

          sendAgentReportToProxy(userMessage);
        }

        function cancelAgentReportRequest() {
          if (!agentRequestInProgress) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'cancel-apollo-agent-report',
                payload: { requestId: agentActiveRequestId },
              },
            },
            '*',
          );
        }

        function resizeAgentComposerInput() {
          if (!agentComposerInput) {
            return;
          }

          agentComposerInput.style.height = '0px';
          const height = Math.min(
            Math.max(agentComposerInput.scrollHeight, 56),
            196,
          );
          agentComposerInput.style.height = `${height}px`;
        }

        function sendAgentReportToProxy(userMessage) {
          const normalizedUserMessage =
            typeof userMessage === 'string' ? userMessage.trim() : '';
          const requestKind = normalizedUserMessage ? 'question' : 'report';

          if (agentRequestInProgress) {
            return;
          }

          if (requestKind === 'report' && !agentReportMeta) {
            return;
          }

          if (requestKind === 'report' && hasAgentSystemState('report')) {
            agentReportMessages = [];
            renderAgentMessages();
          }

          if (requestKind === 'question' && hasAgentSystemState('question')) {
            agentDialogueMessages = [];
            renderAgentMessages();
          }

          agentMessageSequence += 1;
          const requestId = `apollo-agent-${Date.now()}-${agentMessageSequence}`;
          agentActiveRequestId = requestId;
          agentActiveRequestKind = requestKind;
          agentRequestInProgress = true;
          syncAgentViewState();

          parent.postMessage(
            {
              pluginMessage: {
                type: 'send-apollo-agent-report',
                payload: { requestId, userMessage: normalizedUserMessage },
              },
            },
            '*',
          );
        }

        function handleAgentStarted(payload) {
          if (payload.requestId && payload.requestId !== agentActiveRequestId) {
            agentActiveRequestId = payload.requestId;
          }
          agentActiveRequestKind = payload.requestKind || agentActiveRequestKind || 'report';
          agentRequestInProgress = true;
          syncAgentViewState();

          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text:
              agentActiveRequestKind === 'question'
                ? 'Apollo думает'
                : 'Агент анализирует отчёт',
          }, agentActiveRequestKind);
        }

        function handleAgentResult(payload) {
          if (
            payload.requestId &&
            agentActiveRequestId &&
            payload.requestId !== agentActiveRequestId
          ) {
            return;
          }

          const requestKind =
            payload.requestKind || agentActiveRequestKind || 'report';
          agentRequestInProgress = false;
          agentActiveRequestId = null;
          agentActiveRequestKind = null;

          removeAgentLoadingMessage(requestKind);

          if (payload.error) {
            agentMessageSequence += 1;
            setAgentMessages(requestKind, [
              {
                id: `agent-message-${agentMessageSequence}`,
                role: 'error',
                text:
                  'Агент сейчас недоступен\nПроверь подключение прокси и попробуй ещё раз',
              },
            ]);
            renderAgentMessages();
          } else {
            addAgentMessage({
              role: 'assistant',
              text: payload.text || 'Агент вернул пустой ответ.',
            }, requestKind);
          }

          syncAgentViewState();
        }

        function getAgentMessages(requestKind) {
          return requestKind === 'question'
            ? agentDialogueMessages
            : agentReportMessages;
        }

        function setAgentMessages(requestKind, messages) {
          if (requestKind === 'question') {
            agentDialogueMessages = messages;
          } else {
            agentReportMessages = messages;
          }
        }

        function getVisibleAgentRequestKind() {
          return activeApolloView === 'dialogue' ? 'question' : 'report';
        }

        function addAgentMessage(message, requestKind) {
          const targetKind = requestKind || getVisibleAgentRequestKind();
          agentMessageSequence += 1;
          getAgentMessages(targetKind).push({
            id: `agent-message-${agentMessageSequence}`,
            ...message,
          });
          renderAgentMessages();
        }

        function replaceAgentLoadingMessage(message, requestKind) {
          removeAgentLoadingMessage(requestKind);
          addAgentMessage(message, requestKind);
        }

        function removeAgentLoadingMessage(requestKind) {
          const targetKind = requestKind || getVisibleAgentRequestKind();
          setAgentMessages(targetKind, getAgentMessages(targetKind).filter(
            (message) => message.variant !== 'loading',
          ));
          renderAgentMessages();
        }

        function renderAgentMessages() {
          if (!agentConversationInner) {
            return;
          }

          const visibleMessages =
            activeApolloView === 'audit'
              ? []
              : getAgentMessages(getVisibleAgentRequestKind());
          const hasSystemState = hasAgentSystemState();
          agentConversationInner.classList.toggle(
            'system-state-visible',
            hasSystemState,
          );
          agentConversationInner.innerHTML = visibleMessages
            .map((message) => renderAgentMessage(message))
            .join('');

          if (agentConversation) {
            agentConversation.scrollTop = agentConversation.scrollHeight;
          }
        }

        function hasAgentSystemState(requestKind) {
          const targetKind = requestKind || getVisibleAgentRequestKind();
          const messages = getAgentMessages(targetKind);
          return messages.length === 1 && messages[0]?.role === 'error';
        }

        function updateAgentRetryTimer() {
          const shouldRetry =
            activeApolloView === 'report' &&
            hasAgentSystemState('report') &&
            Boolean(agentReportMeta) &&
            !agentRequestInProgress;

          if (!shouldRetry) {
            if (agentRetryTimerId !== null) {
              clearInterval(agentRetryTimerId);
              agentRetryTimerId = null;
            }
            return;
          }

          if (agentRetryTimerId !== null) {
            return;
          }

          agentRetryTimerId = setInterval(() => {
            if (
              activeApolloView === 'report' &&
              hasAgentSystemState('report') &&
              agentReportMeta &&
              !agentRequestInProgress
            ) {
              retryActiveAgentRequest();
            }
          }, 30000);
        }

        function renderAgentMessage(message) {
          if (message.role === 'user') {
            return `<article class="message-card user"><div class="user-msg"><div class="user-msg__stack"><div class="user-msg__line"><div class="user-msg__container">${buildMarkdownMessageMarkup(
              message.text || '',
            )}</div></div></div></div></article>`;
          }

          if (message.role === 'error') {
            return `<article class="message-card system-state"><div class="agent-system-state"><div class="agent-system-state__graphic" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.5 10C7.32843 10 8 10.6716 8 11.5C8 12.3284 7.32843 13 6.5 13C5.67157 13 5 12.3284 5 11.5C5 10.6716 5.67157 10 6.5 10Z" fill="currentColor"/><path d="M13.5 10C14.3284 10 15 10.6716 15 11.5C15 12.3284 14.3284 13 13.5 13C12.6716 13 12 12.3284 12 11.5C12 10.6716 12.6716 10 13.5 10Z" fill="currentColor"/><path d="M10 2C10.8284 2 11.5 2.67157 11.5 3.5C11.5 4.05495 11.198 4.5384 10.75 4.79785V6.9502H14.4512C16.1078 6.95041 17.4512 8.29347 17.4512 9.9502V15C17.4512 16.6567 16.1078 17.9998 14.4512 18H5.55078C3.89393 18 2.55078 16.6569 2.55078 15V9.9502C2.55078 8.29334 3.89393 6.9502 5.55078 6.9502H9.25V4.79785C8.802 4.5384 8.5 4.05495 8.5 3.5C8.5 2.67157 9.17157 2 10 2ZM5.55078 8.4502C4.72236 8.4502 4.05078 9.12177 4.05078 9.9502V15C4.05078 15.8284 4.72235 16.5 5.55078 16.5H14.4512C15.2794 16.4998 15.9512 15.8283 15.9512 15V9.9502C15.9512 9.1219 15.2794 8.45041 14.4512 8.4502H5.55078Z" fill="currentColor"/></svg></div><div class="agent-system-state__title">Агент сейчас недоступен</div><div class="agent-system-state__subtitle">Проверь подключение прокси и попробуй ещё раз</div><button class="agent-system-state__retry" type="button" data-agent-retry-button>Попробовать ещё раз</button></div></article>`;
          }

          if (message.variant === 'loading') {
            const loadingText = message.text || 'Apollo думает';
            return `<article class="message-card assistant"><div class="assistant-msg"><div class="assistant-msg__container"><div class="assistant-actions loading"><span class="spinner" aria-hidden="true"></span><span>${escapeHtml(
              loadingText,
            )}</span></div></div></div></article>`;
          }

          return `<article class="message-card assistant"><div class="assistant-msg"><div class="assistant-msg__container"><div class="assistant-copy">${buildMarkdownMessageMarkup(
            message.text || '',
          )}</div></div></div></article>`;
        }

        function syncAgentViewState() {
          const agentViewActive = activeApolloView !== 'audit';
          if (agentTableFab) {
            agentTableFab.classList.toggle('active', activeApolloView === 'audit');
            agentTableFab.setAttribute(
              'aria-pressed',
              activeApolloView === 'audit' ? 'true' : 'false',
            );
          }
          if (agentReportFab) {
            agentReportFab.disabled = false;
            agentReportFab.classList.toggle(
              'active',
              activeApolloView === 'report',
            );
            agentReportFab.setAttribute(
              'aria-pressed',
              activeApolloView === 'report' ? 'true' : 'false',
            );
          }
          if (agentChatFab) {
            agentChatFab.disabled = false;
            agentChatFab.classList.toggle(
              'active',
              activeApolloView === 'dialogue',
            );
            agentChatFab.setAttribute(
              'aria-pressed',
              activeApolloView === 'dialogue' ? 'true' : 'false',
            );
          }
          if (agentChatOverlay) {
            agentChatOverlay.classList.toggle('visible', agentViewActive);
            agentChatOverlay.setAttribute(
              'aria-hidden',
              agentViewActive ? 'false' : 'true',
            );
          }
          if (mainEl) {
            mainEl.classList.toggle('agent-active', agentViewActive);
          }
          if (workspaceEl) {
            workspaceEl.classList.toggle('agent-active', agentViewActive);
          }
          if (agentComposerInput) {
            agentComposerInput.disabled = agentRequestInProgress;
          }
          if (agentComposer) {
            agentComposer.classList.toggle(
              'hidden',
              activeApolloView !== 'dialogue',
            );
          }
          if (agentComposerSubmit) {
            const hasDraft = Boolean(agentComposerInput?.value?.trim());
            const canStopQuestion =
              agentRequestInProgress && agentActiveRequestKind === 'question';
            agentComposerSubmit.classList.toggle('is-stop', canStopQuestion);
            agentComposerSubmit.classList.toggle(
              'hidden',
              !canStopQuestion && !hasDraft,
            );
            agentComposerSubmit.disabled =
              agentRequestInProgress ? !canStopQuestion : !hasDraft;
            agentComposerSubmit.setAttribute(
              'aria-label',
              canStopQuestion ? 'Остановить ответ' : 'Отправить агенту',
            );
          }
          updateAgentRetryTimer();
        }

        function buildMarkdownMessageMarkup(source) {
          const normalized = normalizeMarkdownSource(source);
          if (!normalized) {
            return '';
          }
          return `<div class="markdown-root">${parseMarkdownBlocks(normalized)
            .map(renderMarkdownBlock)
            .join('')}</div>`;
        }

        function parseMarkdownBlocks(source) {
          const lines = source.split('\n');
          const blocks = [];
          let index = 0;

          while (index < lines.length) {
            const line = lines[index];
            const trimmed = line.trim();
            const normalizedTrimmed = normalizeMarkdownLine(trimmed);

            if (!normalizedTrimmed) {
              index += 1;
              continue;
            }

            if (isCodeFence(normalizedTrimmed)) {
              const code = [];
              index += 1;
              while (
                index < lines.length &&
                !isCodeFence(normalizeMarkdownLine(lines[index].trim()))
              ) {
                code.push(lines[index]);
                index += 1;
              }
              if (index < lines.length) {
                index += 1;
              }
              blocks.push({ type: 'code', code: code.join('\n') });
              continue;
            }

            if (isMarkdownTableStart(lines, index)) {
              const tableLines = [lines[index], lines[index + 1]];
              index += 2;
              while (index < lines.length && isMarkdownTableRow(lines[index])) {
                tableLines.push(lines[index]);
                index += 1;
              }
              blocks.push(parseMarkdownTable(tableLines));
              continue;
            }

            const heading = normalizedTrimmed.match(/^(#{1,6})\s*(.+)$/);
            if (heading) {
              blocks.push({
                type: 'heading',
                depth: heading[1].length,
                text: heading[2].trim(),
              });
              index += 1;
              continue;
            }

            if (/^-{3,}$/.test(normalizedTrimmed)) {
              blocks.push({ type: 'divider' });
              index += 1;
              continue;
            }

            if (/^>\s?/.test(normalizedTrimmed)) {
              const quoteLines = [];
              while (index < lines.length) {
                const quoteLine = normalizeMarkdownLine(lines[index].trim());
                if (!/^>\s?/.test(quoteLine)) {
                  break;
                }
                quoteLines.push(quoteLine.replace(/^>\s?/, ''));
                index += 1;
              }
              blocks.push({ type: 'quote', text: quoteLines.join('\n') });
              continue;
            }

            if (
              isStandaloneQuotedLine(normalizedTrimmed) &&
              shouldTreatAsQuoteAfter(blocks)
            ) {
              blocks.push({
                type: 'quote',
                text: unwrapStandaloneQuote(normalizedTrimmed),
              });
              index += 1;
              continue;
            }

            const listMeta = getListMeta(normalizedTrimmed);
            if (listMeta) {
              const items = [];
              const ordered = listMeta.ordered;
              while (index < lines.length) {
                const currentMeta = getListMeta(
                  normalizeMarkdownLine(lines[index].trim()),
                );
                if (!currentMeta || currentMeta.ordered !== ordered) {
                  break;
                }
                items.push(currentMeta.content);
                index += 1;
              }
              blocks.push({ type: 'list', ordered, items });
              continue;
            }

            const paragraph = [normalizedTrimmed];
            index += 1;
            while (index < lines.length) {
              const next = normalizeMarkdownLine(lines[index].trim());
              if (
                !next ||
                isCodeFence(next) ||
                /^(#{1,6})\s*/.test(next) ||
                isListLine(next) ||
                /^\d+[.)]\s+/.test(next) ||
                /^>\s?/.test(next) ||
                isMarkdownTableStart(lines, index)
              ) {
                break;
              }
              paragraph.push(next);
              index += 1;
            }
            blocks.push({ type: 'paragraph', text: paragraph.join(' ') });
          }

          return blocks;
        }

        function renderMarkdownBlock(block) {
          if (block.type === 'heading') {
            return `<div class="md-block md-block--h${block.depth}"><div class="md-h${block.depth}">${renderInlineMarkdown(
              block.text,
            )}</div></div>`;
          }
          if (block.type === 'paragraph') {
            return `<div class="md-block md-block--paragraph"><p class="md-p">${renderInlineMarkdown(
              block.text,
            )}</p></div>`;
          }
          if (block.type === 'quote') {
            return `<div class="md-block md-block--quote"><p class="md-quote">${renderInlineMarkdown(
              block.text,
            )}</p></div>`;
          }
          if (block.type === 'divider') {
            return '<div class="md-block md-block--divider"><div class="md-divider"></div></div>';
          }
          if (block.type === 'code') {
            return `<div class="md-block md-block--code"><pre class="md-pre"><code>${escapeHtml(
              block.code,
            )}</code></pre></div>`;
          }
          if (block.type === 'table') {
            const head = block.headers
              .map((header) => `<th class="md-th">${renderInlineMarkdown(header)}</th>`)
              .join('');
            const body = block.rows
              .map(
                (row) =>
                  `<tr class="md-tr">${row
                    .map((cell) => `<td class="md-td">${renderInlineMarkdown(cell)}</td>`)
                    .join('')}</tr>`,
              )
              .join('');
            return `<div class="md-block md-block--table"><div class="md-table-wrap"><div class="md-table-scroll"><table class="md-table"><thead><tr class="md-tr">${head}</tr></thead><tbody>${body}</tbody></table></div></div></div>`;
          }

          const items = block.items
            .map((item, index) => {
              const marker = block.ordered ? `${index + 1}.` : '–';
              const markerClass = block.ordered
                ? 'md-list-marker numbered'
                : 'md-list-marker';
              return `<div class="md-list-item"><div class="${markerClass}">${escapeHtml(
                marker,
              )}</div><div class="md-list-content">${renderInlineMarkdown(item)}</div></div>`;
            })
            .join('');
          return `<div class="md-block md-block--list"><div class="md-list">${items}</div></div>`;
        }

        function renderInlineMarkdown(source) {
          const pattern =
            /(\[[^\]]+\]\([^)]+\)|`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*)/g;
          let cursor = 0;
          let html = '';
          pattern.lastIndex = 0;
          let match = pattern.exec(source);
          while (match) {
            if (match.index > cursor) {
              html += renderPlainTextWithAutolinks(source.slice(cursor, match.index));
            }
            html += renderInlineToken(match[0]);
            cursor = match.index + match[0].length;
            match = pattern.exec(source);
          }
          if (cursor < source.length) {
            html += renderPlainTextWithAutolinks(source.slice(cursor));
          }
          return html;
        }

        function renderPlainTextWithAutolinks(source) {
          const urlPattern = /\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/gi;
          let cursor = 0;
          let html = '';
          let match = urlPattern.exec(source);
          while (match) {
            const url = match[0];
            if (match.index > cursor) {
              html += escapeHtml(source.slice(cursor, match.index));
            }
            const escapedUrl = escapeHtml(url);
            html += `<a class="md-link" href="${escapedUrl}" target="_blank" rel="noreferrer">${escapedUrl}</a>`;
            cursor = match.index + url.length;
            match = urlPattern.exec(source);
          }
          if (cursor < source.length) {
            html += escapeHtml(source.slice(cursor));
          }
          return html;
        }

        function renderInlineToken(token) {
          const linkMatch = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
          if (linkMatch) {
            const href = escapeHtml(linkMatch[2]);
            return `<a class="md-link" href="${href}" target="_blank" rel="noreferrer">${renderInlineMarkdown(
              linkMatch[1],
            )}</a>`;
          }
          if (token.startsWith('`') && token.endsWith('`')) {
            return `<code class="md-code-inline">${escapeHtml(token.slice(1, -1))}</code>`;
          }
          if (token.startsWith('**') && token.endsWith('**')) {
            return `<strong class="md-strong">${renderInlineMarkdown(
              token.slice(2, -2),
            )}</strong>`;
          }
          if (token.startsWith('*') && token.endsWith('*')) {
            return `<em class="md-em">${renderInlineMarkdown(token.slice(1, -1))}</em>`;
          }
          return escapeHtml(token);
        }

        function isMarkdownTableStart(lines, index) {
          return (
            index + 1 < lines.length &&
            isMarkdownTableRow(lines[index]) &&
            isMarkdownTableSeparator(lines[index + 1])
          );
        }

        function isMarkdownTableRow(line) {
          const normalized = sanitizeMarkdownTableLine(line);
          return normalized.includes('|') && normalized.trim().startsWith('|');
        }

        function isMarkdownTableSeparator(line) {
          const cells = sanitizeMarkdownTableLine(line)
            .split('|')
            .slice(1, -1)
            .map((cell) => cell.trim());
          return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
        }

        function parseMarkdownTable(lines) {
          const headers = splitMarkdownTableRow(lines[0]);
          const rows = lines.slice(2).map((line) =>
            normalizeMarkdownTableCells(splitMarkdownTableRow(line), headers.length),
          );
          return { type: 'table', headers, rows };
        }

        function splitMarkdownTableRow(line) {
          return sanitizeMarkdownTableLine(line)
            .split('|')
            .slice(1, -1)
            .map((cell) => cell.trim());
        }

        function sanitizeMarkdownTableLine(line) {
          const trimmed = String(line || '').trim().replace(/\|\.\s*$/, '|');
          if (trimmed.startsWith('|') && !trimmed.endsWith('|')) {
            return `${trimmed} |`;
          }
          return trimmed;
        }

        function normalizeMarkdownTableCells(cells, count) {
          const normalized = cells.slice(0, count);
          while (normalized.length < count) {
            normalized.push('');
          }
          return normalized;
        }

        function getListMeta(line) {
          const orderedMatch = line.match(/^\s*(\d+)[.)]\s+(.+)$/);
          if (orderedMatch) {
            return { ordered: true, content: orderedMatch[2].trim() };
          }
          const unorderedMatch = line.match(/^\s*[-*+–—•]\s+(.+)$/);
          if (unorderedMatch) {
            return { ordered: false, content: unorderedMatch[1].trim() };
          }
          return null;
        }

        function normalizeMarkdownSource(source) {
          return String(source || '')
            .replace(/\r\n?/g, '\n')
            .replace(/[“”]/g, '"')
            .replace(/[‘’]/g, "'")
            .replace(/^\uFEFF/, '')
            .trim();
        }

        function normalizeMarkdownLine(line) {
          return String(line || '')
            .replace(/\u00a0/g, ' ')
            .replace(/^`{3,}\s*$/g, '```')
            .replace(/^`{3,}\s*([A-Za-z0-9_-]+)\s*$/g, '```$1')
            .trim();
        }

        function isCodeFence(line) {
          return /^`{3,}(?:[A-Za-z0-9_-]+)?\s*$/.test(line);
        }

        function isListLine(line) {
          return Boolean(getListMeta(line));
        }

        function shouldTreatAsQuoteAfter(blocks) {
          const previous = blocks[blocks.length - 1];
          if (!previous) {
            return false;
          }
          const previousText = String(previous.text || '').toLowerCase();
          if (previous.type !== 'paragraph' && previous.type !== 'heading') {
            return false;
          }
          return /(^|\s)(правило|цитата|source quote|quote)[^.!?]*:\s*$/.test(
            previousText,
          );
        }

        function isStandaloneQuotedLine(line) {
          return (
            /^["'«„“][\s\S]+["'»“”]$/.test(line) ||
            /^"«[\s\S]+»"$/.test(line) ||
            /^«[\s\S]+»$/.test(line)
          );
        }

        function unwrapStandaloneQuote(line) {
          return String(line || '')
            .replace(/^["'«„“]\s*/, '')
            .replace(/\s*["'»“”]$/, '');
        }

        function escapeHtml(value) {
          return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function refreshScanButton() {
          syncChromeState();
        }

        function updateLoaderVisibility() {
          syncChromeState();
        }

        function handleCatalogFileLoaded(payload) {
          if (!payload?.name) return;
          showCatalogToast(payload.name);
        }

        function handleScanActionPress() {
          if (isScanning) {
            parent.postMessage({ pluginMessage: { type: 'cancel-scan' } }, '*');
            return;
          }

          if (!catalogsReady) return;

          actionPhase = 'scanning';
          setScanningState(true);

          window.requestAnimationFrame(() => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: 'scan-selection',
                  payload: {
                    channelId: currentChannelId,
                    pickerLabel: currentPickerLabel,
                    shellAuditEnabled,
                  },
                },
              },
              '*',
            );
          });
        }

        function handlePickerChange(nextPickerLabel) {
          if (typeof nextPickerLabel !== 'string') {
            return;
          }

          const normalizedPickerLabel = nextPickerLabel.trim();
          if (!normalizedPickerLabel) {
            return;
          }

          currentPickerLabel = normalizedPickerLabel;
          const activeVisibleTab = getVisibleTabs().find(
            (tab) => tab.id === currentTab,
          );
          if (!activeVisibleTab && getVisibleTabs()[0]) {
            currentTab = getVisibleTabs()[0].id;
          }
          syncChromeState();
        }

        function handleChannelChange(nextChannelId) {
          if (typeof nextChannelId !== 'string') {
            return;
          }

          const normalizedChannelId = nextChannelId.trim();
          if (!normalizedChannelId) {
            return;
          }

          currentChannelId = normalizedChannelId;
          syncChromeState();
        }

        function handleShellAuditToggle() {
          if (isScanning) {
            return;
          }

          shellAuditEnabled = !shellAuditEnabled;
          syncChromeState();
        }

        function handleGenerationExampleCapture(payload) {
          parent.postMessage(
            {
              pluginMessage: {
                type: 'capture-generation-example',
                payload,
              },
            },
            '*',
          );
        }

        function applyCompactMode() {
          if (shellEl) {
            shellEl.classList.toggle('compact', isCompact);
          }
          if (workspaceEl) {
            workspaceEl.classList.toggle('compact', isCompact);
          }
          if (viewSegmentedControl) {
            viewSegmentedControl.classList.toggle('compact', isCompact);
          }
          syncChromeState();
        }

        function toggleCompactMode() {
          setCompactMode(!isCompact);
        }

        function setCompactMode(nextCompact) {
          if (isCompact === nextCompact) {
            syncChromeState();
            return;
          }

          isCompact = nextCompact;
          applyCompactMode();
          parent.postMessage(
            {
              pluginMessage: {
                type: 'set-ui-compact',
                payload: { compact: nextCompact },
              },
            },
            '*',
          );
        }

        function handleTabSelection(tabId, count) {
          if (!count) {
            return;
          }

          if (isCompact) {
            setCompactMode(false);
          }

          setActiveTab(tabId);
        }

        function syncChromeState() {
          const tabs = getVisibleTabs().map((tab) => {
            const items = tab.source();
            const count = Array.isArray(items) ? items.length : 0;
            return {
              id: tab.id,
              title: tab.title,
              count,
              active: !isCompact && tab.id === currentTab,
              counterType: getCounterType(tab.id, count),
            };
          });

          const isActionScanning = actionPhase === 'scanning';
          const isActionCatalogLoading = actionPhase === 'catalog-loading';

          const chromeState = {
            title: 'Apollo',
            channelId: currentChannelId,
            pickerLabel: currentPickerLabel,
            actionLabel: isActionScanning
              ? 'Остановить'
              : isActionCatalogLoading
                ? 'Загрузка каталогов...'
                : 'Проверить',
            actionDisabled: isActionCatalogLoading,
            actionLoading: isActionScanning || isActionCatalogLoading,
            actionType:
              isActionScanning || isActionCatalogLoading
                ? 'secondary'
                : 'primary',
            compact: isCompact,
            shellAuditEnabled,
            tabs,
          };

          if (chromeBridge && chromeBridgeMounted) {
            try {
              chromeBridge.update(chromeState);
              return;
            } catch (error) {
              chromeBridgeMounted = false;
              console.error('[Apollo] chrome bridge update failed', error);
            }
          }

          console.error('[Apollo] chrome bridge is unavailable');
        }

        function getCounterType(tabId, count) {
          if (!count) {
            return 'empty';
          }

          if (
            tabId === 'deprecated' ||
            tabId === 'themization' ||
            tabId === 'wrongChannel' ||
            tabId === 'deprecatedStyles' ||
            tabId === 'customStyles'
          ) {
            return 'error';
          }

          if (
            tabId === 'update' ||
            tabId === 'changes' ||
            tabId === 'local' ||
            tabId === 'detached'
          ) {
            return 'warning';
          }

          return 'general';
        }

        function getHiddenTabIds() {
          const hiddenFromResults = Array.isArray(currentResults?.ui?.hiddenTabIds)
            ? currentResults.ui.hiddenTabIds
            : [];
          const normalizedPicker = String(currentPickerLabel || '').trim().toLowerCase();
          const hiddenByPicker =
            normalizedPicker === 'ios' || normalizedPicker === 'android'
              ? ['themization']
              : [];
          return Array.from(new Set([...hiddenFromResults, ...hiddenByPicker]));
        }

        function getVisibleTabs() {
          const hiddenIds = new Set(getHiddenTabIds());
          return tabConfig.filter((tab) => !hiddenIds.has(tab.id));
        }
      })();
    </script>
  </body>
</html>
