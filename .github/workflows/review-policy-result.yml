name: Owner approval gate

on:
  workflow_run:
    workflows: [Review policy]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: write

# Every run refreshes all open PRs, so coalescing pending events loses no PR.
concurrency:
  group: apollo-owner-approval-${{ github.repository }}
  cancel-in-progress: false

jobs:
  approvals:
    name: Reconcile owner approvals
    if: ${{ github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/review-policy.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v9
        with:
          script: |
            await require('./scripts/review-policy.cjs')({ github, context, core });
