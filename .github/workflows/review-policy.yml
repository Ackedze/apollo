name: Review policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  event:
    name: Review policy event
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'The trusted Owner approval gate refreshes the current PR state.'
