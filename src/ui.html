<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font:
          12px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #111;
        background: #eceff3;
      }
      .shell {
        width: 800px;
        height: 860px;
        margin: 0 auto;
        background: #fff;
        border-radius: 0;
        display: flex;
        flex-direction: column;
      }
      .shell.compact {
        width: 263px;
      }

      .header {
        padding: 0;
        border-bottom: 1px solid #ececf2;
      }

      .results-pane {
        flex: 1;
        min-width: 0;
        max-height: 100%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #f3f4f7;
        padding: 12px;
        box-sizing: border-box;
      }
      #react-results {
        display: none;
      }
      .workspace {
        display: grid;
        grid-template-columns: 263px 1fr;
        gap: 8px;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .workspace.compact {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .sidebar {
        width: 263px;
        padding: 12px;
        overflow-y: auto;
        max-height: 100%;
        box-sizing: border-box;
      }
      .workspace.compact .sidebar {
        padding-right: 12px;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .workspace.compact .main {
        display: none;
      }
      .placeholder {
        padding: 24px;
        text-align: center;
        color: #999;
      }
      #toast {
        position: absolute;
        inset: auto 16px 16px auto;
        background: #111827;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #toast.visible {
        opacity: 1;
      }
      .agent-chat-fab {
        position: absolute;
        right: 20px;
        bottom: 20px;
        z-index: 20;
        display: none;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50%;
        background: #111827;
        color: #fff;
        box-shadow:
          0 10px 24px rgba(15, 23, 42, 0.18),
          0 2px 6px rgba(15, 23, 42, 0.16);
        cursor: pointer;
      }
      .agent-chat-fab.visible {
        display: inline-flex;
      }
      .agent-chat-fab svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .agent-chat-overlay {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        background: rgba(17, 24, 39, 0.18);
      }
      .agent-chat-overlay.visible {
        display: block;
      }
      .agent-chat-panel {
        position: absolute;
        top: 16px;
        right: 16px;
        bottom: 16px;
        left: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 16px;
        background: #f5f5f5;
        box-shadow:
          0 18px 44px rgba(15, 23, 42, 0.2),
          0 0 0 1px rgba(15, 23, 42, 0.08);
      }
      .agent-chat-panel,
      .agent-chat-panel *,
      .agent-chat-panel *::before,
      .agent-chat-panel *::after {
        box-sizing: border-box;
      }
      .agent-chat-header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 52px;
        padding: 12px 16px;
        border-bottom: 1px solid #e7e7e7;
        background: #fff;
      }
      .agent-chat-title {
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        color: rgba(3, 3, 6, 0.88);
      }
      .agent-chat-meta {
        margin-top: 2px;
        font-size: 11px;
        line-height: 14px;
        color: rgba(5, 8, 29, 0.45);
      }
      .agent-chat-close {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: rgba(3, 3, 6, 0.72);
        cursor: pointer;
      }
      .agent-chat-close:hover {
        background: rgba(30, 43, 68, 0.08);
      }
      .agent-conversation {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 8px 20px 20px;
      }
      .agent-conversation-inner {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-width: 0;
      }
      .message-card {
        width: 100%;
        min-width: 0;
      }
      .message-card.user {
        padding: 0;
      }
      .user-msg {
        display: flex;
        width: 100%;
        min-width: 0;
        padding: 12px 0 16px;
      }
      .user-msg__stack {
        display: flex;
        width: 100%;
        min-width: 0;
        flex-direction: column;
        align-items: flex-end;
      }
      .user-msg__line {
        display: flex;
        width: 100%;
        min-width: 0;
        justify-content: flex-end;
      }
      .user-msg__container {
        width: fit-content;
        max-width: min(100%, 400px);
        min-width: 0;
        border-radius: 14px 14px 6px 14px;
        background: #fff;
        padding: 12px 16px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 14px;
        line-height: 20px;
        overflow-wrap: anywhere;
      }
      .assistant-msg {
        display: flex;
        width: 100%;
        min-width: 0;
        padding: 12px 0 16px;
      }
      .assistant-msg__container {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        color: rgba(3, 3, 6, 0.88);
      }
      .assistant-msg__container.error {
        color: #c33d2f;
      }
      .assistant-copy {
        position: relative;
        width: 100%;
        max-width: 100%;
        color: inherit;
        font-size: 15px;
        line-height: 22px;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }
      .assistant-actions.loading {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: rgba(5, 8, 29, 0.45);
        font-size: 13px;
        line-height: 18px;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(30, 43, 68, 0.16);
        border-top-color: rgba(3, 3, 6, 0.72);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .markdown-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
      }
      .md-block {
        width: 100%;
        min-width: 0;
      }
      .md-block--h1,
      .md-block--paragraph,
      .md-block--quote,
      .md-block--list {
        padding-bottom: 12px;
      }
      .md-block--h2 {
        padding: 24px 0 14px;
      }
      .md-block--h3,
      .md-block--divider,
      .md-block--table,
      .md-block--code {
        padding: 14px 0 12px;
      }
      .md-block:first-child {
        padding-top: 0;
      }
      .md-block:last-child {
        padding-bottom: 0;
      }
      .md-h1,
      .md-h2,
      .md-h3,
      .md-p,
      .md-quote,
      .md-list-content,
      .md-th,
      .md-td,
      .md-pre {
        margin: 0;
      }
      .md-h1 {
        font-size: 20px;
        line-height: 26px;
        font-weight: 700;
      }
      .md-h2 {
        font-size: 17px;
        line-height: 24px;
        font-weight: 700;
      }
      .md-h3 {
        font-size: 15px;
        line-height: 22px;
        font-weight: 700;
      }
      .md-p,
      .md-list-content,
      .md-th,
      .md-td,
      .md-pre {
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        color: inherit;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .md-quote {
        font-size: 13px;
        line-height: 18px;
        color: rgba(4, 4, 19, 0.55);
      }
      .md-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .md-list-item {
        display: flex;
        align-items: flex-start;
      }
      .md-list-marker {
        width: 22px;
        flex: 0 0 22px;
        padding-right: 6px;
        text-align: right;
        font-size: 14px;
        line-height: 20px;
      }
      .md-list-marker.numbered {
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      .md-list-content {
        flex: 1 1 auto;
        min-width: 0;
      }
      .md-divider {
        width: 100%;
        height: 1px;
        background: #e7e8eb;
      }
      .md-table-wrap {
        width: 100%;
        max-width: 100%;
        border: 1px solid #e7e8eb;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        overflow: hidden;
      }
      .md-table-scroll {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .md-table {
        width: max-content;
        min-width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      .md-th,
      .md-td {
        min-width: 96px;
        max-width: 240px;
        padding: 10px 12px;
        vertical-align: top;
        text-align: left;
        font-size: 13px;
        line-height: 18px;
        white-space: normal;
        word-break: normal;
        overflow-wrap: anywhere;
      }
      .md-th {
        font-weight: 700;
        background: rgba(30, 43, 68, 0.06);
      }
      .md-tr + .md-tr .md-td,
      .md-tr + .md-tr .md-th {
        border-top: 1px solid #e7e8eb;
      }
      .md-th + .md-th,
      .md-td + .md-td {
        border-left: 1px solid #e7e8eb;
      }
      .md-pre {
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(30, 43, 68, 0.06);
        overflow-x: auto;
        max-width: 100%;
        white-space: pre-wrap;
      }
      .md-code-inline {
        padding: 1px 5px;
        border-radius: 6px;
        background: rgba(30, 43, 68, 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.95em;
      }
      .md-strong {
        font-weight: 700;
      }
      .md-em {
        font-style: italic;
      }
      .md-link {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- ui-app-css -->
  </head>

  <body>
    <div class="shell">
      <header class="header">
        <div id="react-top-section"></div>
      </header>
      <div class="workspace">
        <aside class="sidebar">
          <div id="react-left-section"></div>
        </aside>
        <main class="main">
          <div id="react-results" class="results-pane"></div>
          <div id="results" class="results-pane placeholder">
            Начните со сканирования.
          </div>
        </main>
      </div>
    </div>
    <div id="toast"></div>
    <button
      id="agent-chat-fab"
      class="agent-chat-fab"
      type="button"
      aria-label="Открыть рекомендации агента"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M21 11.5a8.5 8.5 0 0 1-9.7 8.42 8.7 8.7 0 0 1-3.2-1.1L3 20l1.2-4.35A8.4 8.4 0 0 1 3 11.5C3 6.8 7.03 3 12 3s9 3.8 9 8.5Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
        <path
          d="M8 10.25h8M8 13.5h5.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <section
      id="agent-chat-overlay"
      class="agent-chat-overlay"
      aria-hidden="true"
    >
      <div class="agent-chat-panel" role="dialog" aria-modal="true" aria-label="Рекомендации Apollo агента">
        <header class="agent-chat-header">
          <div>
            <div class="agent-chat-title">Apollo agent</div>
            <div id="agent-chat-meta" class="agent-chat-meta">Отчёт ещё не отправлен</div>
          </div>
          <button
            id="agent-chat-close"
            class="agent-chat-close"
            type="button"
            aria-label="Закрыть рекомендации агента"
          >
            ×
          </button>
        </header>
        <section id="agent-conversation" class="agent-conversation" aria-live="polite">
          <div id="agent-conversation-inner" class="agent-conversation-inner"></div>
        </section>
      </div>
    </section>
    <script src="./ui-app.js"></script>
    <script>
      (function () {
        let tabConfig = [];
        let leftSectionOrder = [
          'themization',
          'wrongChannel',
          'technical',
          'deprecated',
          'deprecatedStyles',
          'customStyles',
          '__divider_after_customStyles__',
          'update',
          'changes',
          'local',
          'detached',
          '__divider_after_detached__',
          'presets',
          'current',
        ];

        function initializeTabConfig(payload) {
          const definitions = Array.isArray(payload)
            ? payload
            : Array.isArray(payload?.definitions)
              ? payload.definitions
              : null;
          if (!definitions) return;

          if (Array.isArray(payload?.leftSectionOrder)) {
            leftSectionOrder = payload.leftSectionOrder.slice();
          }

          tabConfig = definitions
            .map((definition) => {
              const source = getTabSource(definition.id);
              if (!source) return null;
              return {
                ...definition,
                source,
              };
            })
            .filter(Boolean);
          renderTabs();
          const target =
            getVisibleTabs().find((tab) => tab.id === currentTab) ??
            getVisibleTabs()[0] ??
            tabConfig[0];
          if (target) {
            setActiveTab(target.id);
          }
        }

        function getValueFromPath(source, path) {
          if (!source || !Array.isArray(path)) return undefined;
          let current = source;
          for (const key of path) {
            if (!current || typeof current !== 'object') {
              return undefined;
            }
            current = current[key];
          }
          return current;
        }

        function resolveViewArray(path) {
          const primaryValue = getValueFromPath(
            currentResults?.visibleViews,
            path,
          );
          if (Array.isArray(primaryValue)) return primaryValue;
          return [];
        }

        function getTabSource(tabId) {
          switch (tabId) {
            case 'current':
              return () => resolveViewArray(['relevance', 'current']);
            case 'detached':
              return () => resolveViewArray(['detached']);
            case 'changes':
              return () => resolveViewArray(['changes']);
            case 'technical':
              return () => resolveViewArray(['relevance', 'technical']);
            case 'deprecated':
              return () => resolveViewArray(['relevance', 'deprecated']);
            case 'update':
              return () => resolveViewArray(['relevance', 'update']);
            case 'themization':
              return () => resolveViewArray(['themization']);
            case 'wrongChannel':
              return () => resolveViewArray(['wrongChannel']);
            case 'local':
              return () => resolveViewArray(['local']);
            case 'deprecatedStyles':
              return () => resolveViewArray(['deprecatedStyles']);
            case 'customStyles':
              return () => resolveViewArray(['customStyles']);
            case 'presets':
              return () => resolveViewArray(['presets']);
            default:
              return () => [];
          }
        }

        let currentTab = 'current';
        let currentResults = null;
        let isScanning = false;
        let catalogsReady = false;
        let catalogsLoading = true;
        let actionPhase = 'catalog-loading';
        let scanCompleted = false;
        let isCompact = false;
        let currentPickerLabel = 'Desktop';
        let agentReportMeta = null;
        let agentChatOpen = false;
        let agentRequestInProgress = false;
        let agentActiveRequestId = null;
        let agentLastSentReportId = null;
        let agentMessages = [];
        let agentMessageSequence = 0;

        const shellEl = document.querySelector('.shell');
        const workspaceEl = document.querySelector('.workspace');
        const listContainer = document.getElementById('results');
        const reactResultsContainer = document.getElementById('react-results');
        const toastEl = document.getElementById('toast');
        const topChromeContainer = document.getElementById('react-top-section');
        const leftChromeContainer =
          document.getElementById('react-left-section');
        const agentChatFab = document.getElementById('agent-chat-fab');
        const agentChatOverlay = document.getElementById('agent-chat-overlay');
        const agentChatClose = document.getElementById('agent-chat-close');
        const agentChatMeta = document.getElementById('agent-chat-meta');
        const agentConversation = document.getElementById('agent-conversation');
        const agentConversationInner = document.getElementById(
          'agent-conversation-inner',
        );
        const chromeBridge = window.ApolloChromeBridge || null;
        const resultsBridge = window.ApolloResultsBridge || null;
        let chromeBridgeMounted = false;
        let resultsBridgeMounted = false;

        if (chromeBridge) {
          try {
            chromeBridgeMounted = Boolean(
              chromeBridge.mount({
                topRootId: 'react-top-section',
                leftRootId: 'react-left-section',
                onActionPress: handleScanActionPress,
                onTabSelect: handleTabSelection,
                onToggleCompact: toggleCompactMode,
                onPickerChange: handlePickerChange,
              }),
            );
          } catch (error) {
            chromeBridgeMounted = false;
            console.error('[Apollo] chrome bridge mount failed', error);
          }
        }

        if (resultsBridge) {
          try {
            resultsBridgeMounted = Boolean(
              resultsBridge.mount({
                rootId: 'react-results',
                onFocusItem: focusNodeById,
              }),
            );
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge mount failed', error);
          }
        }

        applyCompactMode();
        setScanningState(false);
        syncAgentChatState();

        agentChatFab?.addEventListener('click', openAgentChat);
        agentChatClose?.addEventListener('click', closeAgentChat);
        agentChatOverlay?.addEventListener('click', (event) => {
          if (event.target === agentChatOverlay) {
            closeAgentChat();
          }
        });

        /* ====== Рендер шапки табов ====== */
        function renderTabs() {
          syncChromeState();
        }

        function setActiveTab(tabId) {
          if (!tabConfig.length) {
            currentTab = tabId;
            return;
          }
          const visibleTabs = getVisibleTabs();
          const tab = visibleTabs.find((entry) => entry.id === tabId);
          if (!tab) {
            const fallbackTab = visibleTabs[0] ?? null;
            if (fallbackTab) {
              currentTab = fallbackTab.id;
              updateActiveTabClasses();
              renderList();
            }
            return;
          }
          currentTab = tab.id;
          updateActiveTabClasses();
          renderList();
        }

        function updateActiveTabClasses() {
          syncChromeState();
        }

        /* ======== Рендер текущего таба и маршрутизация ======= */
        function renderList() {
          if (!listContainer) return;
          hideReactResults();
          listContainer.innerHTML = '';

          const tab = getVisibleTabs().find((entry) => entry.id === currentTab);
          if (!tab) {
            showPlaceholder('Выберите таб');
            return;
          }

          const sourceItems = tab.source();
          const items = Array.isArray(sourceItems) ? sourceItems : [];

          if (!currentResults) {
            if (catalogsLoading || !catalogsReady) {
              showMainPlaceholder();
              return;
            }

            if (!scanCompleted) {
              showMainPlaceholder();
              return;
            }

            showPlaceholder('Пока ничего не найдено');
            return;
          }

          if (
            shouldUseAuditReactResults(tab.id) &&
            renderCurrentReactResults(items)
          ) {
            return;
          }

          if (tab.id === 'detached' && renderDetachedReactResults(items)) {
            return;
          }

          if (tab.id === 'themization' && renderThemizationReactResults(items)) {
            return;
          }

          if (tab.id === 'changes' && renderCustomizationReactResults(items)) {
            return;
          }

          if (
            tab.id === 'deprecatedStyles' &&
            renderDeprecatedStylesReactResults(items)
          ) {
            return;
          }

          if (
            tab.id === 'customStyles' &&
            renderCustomStylesReactResults(items)
          ) {
            return;
          }

          if (!items.length) {
            showPlaceholder(
              tab.emptyMessage ?? 'Нет компонентов по этому критерию',
            );
            return;
          }

          showPlaceholder('Не удалось отрисовать результаты');
        }

        function showPlaceholder(message) {
          if (!listContainer) return;
          hideReactResults();
          listContainer.innerHTML = '';
          const placeholder = document.createElement('div');
          placeholder.className = 'placeholder';
          placeholder.textContent = message;
          listContainer.appendChild(placeholder);
        }

        function showMainPlaceholder() {
          if (resultsBridge && resultsBridgeMounted) {
            try {
              resultsBridge.showPlaceholder(
                'Выбери область и нажми Проверить',
                'Это может быть страница, блок или отдельный компонент',
              );
              showReactResults();
              return;
            } catch (error) {
              resultsBridgeMounted = false;
              console.error(
                '[Apollo] results bridge placeholder failed',
                error,
              );
              hideReactResults();
            }
          }

          showPlaceholder('Выбери область и нажми Проверить');
        }

        function focusNodeById(nodeId) {
          if (!nodeId) return;
          parent.postMessage(
            {
              pluginMessage: {
                type: 'focus-node',
                payload: { id: nodeId },
              },
            },
            '*',
          );
        }

        function requestCustomizationReset(
          rootId,
          nodeId,
          messages,
          details = [],
          remediations = [],
        ) {
          if (
            !rootId ||
            !nodeId ||
            (!Array.isArray(messages) &&
              !Array.isArray(details) &&
              !Array.isArray(remediations)) ||
            (!messages.length && !details.length && !remediations.length)
          ) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'reset-customization-group',
                payload: {
                  rootId,
                  nodeId,
                  messages,
                  details,
                  remediations,
                },
              },
            },
            '*',
          );
        }

        function buildCustomizationResetActions(rootId, group) {
          if (!rootId || !group?.nodeId) {
            return [];
          }

          const actions = [];
          const hasComponentProperties =
            Array.isArray(group.remediations) && group.remediations.length > 0;
          const hasLayerProperties =
            (Array.isArray(group.details) && group.details.length > 0) ||
            (Array.isArray(group.messages) && group.messages.length > 0);

          if (hasComponentProperties && hasLayerProperties) {
            const allMessages = [
              ...(Array.isArray(group.messages) ? group.messages : []),
              ...(Array.isArray(group.details)
                ? group.details
                    .map((detail) => detail?.message)
                    .filter((message) => typeof message === 'string' && message.length)
                : []),
            ];
            actions.push({
              label: 'Сбросить всё',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  allMessages,
                  [],
                  group.remediations,
                ),
            });
          }

          if (hasComponentProperties) {
            actions.push({
              label: 'Параметры',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  [],
                  [],
                  group.remediations,
                ),
            });
          }

          if (hasLayerProperties) {
            actions.push({
              label: 'Слой',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  group.messages,
                  group.details,
                  [],
                ),
            });
          }

          return actions;
        }

        function sortCustomizationGroupsByPath(groups) {
          return groups
            .map((group) => ({
              group,
              order: getCustomizationGroupSortOrder(group, groups),
            }))
            .sort((left, right) => compareCustomizationGroupSortEntries(left, right))
            .map((entry) => entry.group);
        }

        function compareCustomizationGroupSortEntries(leftEntry, rightEntry) {
          const left = leftEntry.group;
          const right = rightEntry.group;
          const leftPath = getCustomizationGroupPath(left);
          const rightPath = getCustomizationGroupPath(right);
          if (leftEntry.order !== rightEntry.order) {
            return leftEntry.order - rightEntry.order;
          }
          if (leftPath === rightPath) {
            return (left?.order ?? 0) - (right?.order ?? 0);
          }
          if (isAncestorPath(leftPath, rightPath)) {
            return -1;
          }
          if (isAncestorPath(rightPath, leftPath)) {
            return 1;
          }

          return (left?.order ?? 0) - (right?.order ?? 0);
        }

        function getCustomizationGroupSortOrder(group, groups) {
          const groupPath = getCustomizationGroupPath(group);
          let order = group?.order ?? 0;
          groups.forEach((candidate) => {
            const candidatePath = getCustomizationGroupPath(candidate);
            if (isAncestorPath(groupPath, candidatePath)) {
              order = Math.min(order, candidate?.order ?? order);
            }
          });
          return order;
        }

        function getCustomizationGroupPath(group) {
          return String(group?.nodePath || group?.name || '');
        }

        function isAncestorPath(parentPath, childPath) {
          if (!parentPath || !childPath || parentPath === childPath) {
            return false;
          }
          return childPath.indexOf(`${parentPath} / `) === 0;
        }

        function requestThemizationAction(
          kind,
          nodeId,
          themeCollectionId,
          targetModeId,
          replacementComponentKey,
        ) {
          if (!kind || !nodeId) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'apply-themization-action',
                payload: {
                  kind,
                  nodeId,
                  themeCollectionId,
                  targetModeId,
                  replacementComponentKey,
                },
              },
            },
            '*',
          );
        }

        function showReactResults() {
          if (reactResultsContainer) {
            reactResultsContainer.style.display = 'flex';
          }
          if (listContainer) {
            listContainer.style.display = 'none';
          }
        }

        function hideReactResults() {
          if (reactResultsContainer) {
            reactResultsContainer.style.display = 'none';
          }
          if (listContainer) {
            listContainer.style.display = 'flex';
          }
          if (resultsBridge && resultsBridgeMounted) {
            try {
              resultsBridge.clear();
            } catch (error) {
              resultsBridgeMounted = false;
              console.error('[Apollo] results bridge clear failed', error);
            }
          }
        }

        function renderCurrentReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((item) => ({
            kind: 'audit',
            id: item.id,
            title: item.name ?? 'Без названия',
            caption: getItemLibraryName(item) ?? undefined,
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderCustomStylesReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((entry) => ({
            kind: 'customStyle',
            id: entry.id,
            title: entry.name || entry.pageName || 'Слой',
            caption: formatCustomStyleReason(entry.reason || '') || undefined,
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderDeprecatedStylesReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const groupedEntries = groupDeprecatedStyleEntries(items);
          const reactItems = groupedEntries.map((group) => ({
            kind: 'deprecatedStyle',
            id: group.id,
            title: '❌ ' + (group.styleLabel || 'Unknown style'),
            caption: group.sourceLibrary || formatDeprecatedStyleSource(group.sourceFile),
            usages: group.usages.map((usage) => ({
              id: usage.id,
              name: formatDeprecatedStyleReason(usage.reason || ''),
              onFocus: usage.id ? () => focusNodeById(usage.id) : undefined,
            })),
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderDetachedReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((entry) => ({
            kind: 'detached',
            id: entry.id,
            title: entry.name || 'Слой',
            caption: entry.libraryName || undefined,
            targetName: entry.componentName || 'Source Component Name',
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function renderThemizationReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items.map((entry) => ({
            kind: 'themization',
            id: entry.nodeId || entry.id,
            title: entry.name || 'Темизация',
            caption:
              entry.kind === 'corporateComponent'
                ? entry.libraryName || undefined
                : undefined,
            targetName: entry.recommendation || 'Проверьте настройки темизации',
            onReplace:
              entry.nodeId &&
              (entry.kind === 'corporateComponent' || entry.kind === 'missingThemeMode')
              ? () =>
                  requestThemizationAction(
                    entry.kind,
                    entry.nodeId,
                    entry.themeCollectionId,
                    entry.targetModeId,
                    entry.replacementComponentKey,
                  )
              : undefined,
          }));

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function parseCustomizationDiffMessage(message) {
          if (typeof message !== 'string') {
            return null;
          }

          const trimmed = message.trim();
          if (!trimmed) {
            return null;
          }

          const separatorIndex = trimmed.indexOf(':');
          if (separatorIndex === -1) {
            return {
              label: 'Изменение',
              values: [trimmed],
            };
          }

          const rawLabel = trimmed.slice(0, separatorIndex).trim();
          const rawValue = trimmed.slice(separatorIndex + 1).trim();

          if (!rawValue) {
            return {
              label: rawLabel || 'Изменение',
              values: ['—'],
            };
          }

          const parts = rawValue
            .split('→')
            .map((part) => part.trim())
            .filter(Boolean);

          return {
            label: rawLabel || 'Изменение',
            values: parts.length ? parts : [rawValue],
          };
        }

        function renderCustomizationReactResults(items) {
          if (!resultsBridge || !resultsBridgeMounted || !items.length) {
            return false;
          }

          const reactItems = items
            .map((item) => {
              const diffs = prepareChangeDiffs(item);
              if (!diffs.length) {
                return null;
              }

              const groupsMap = new Map();
              diffs.forEach((diff, index) => {
                const groupId =
                  diff.nodeId ||
                  diff.nodePath ||
                  diff.nodeName ||
                  `${item.id}:diff:${index}`;
                const existing = groupsMap.get(groupId);
                const parsed = parseCustomizationDiffMessage(diff.message);
                const isVariantDiff =
                  typeof diff.details?.property === 'string' &&
                  diff.details.property.indexOf('variant.') === 0;
                const marker =
                  !isVariantDiff &&
                  (diff.assessment?.verdict === 'expected' ||
                    diff.assessment?.verdict === 'allowed')
                    ? 'Expected'
                    : undefined;
                const line = parsed
                  ? {
                      ...parsed,
                      marker,
                    }
                  : {
                      label: 'Изменение',
                      values: [(diff.message || '').trim() || '—'],
                      marker,
                    };
                const canReset =
                  diff.assessment?.verdict !== 'expected' &&
                  diff.assessment?.verdict !== 'allowed';
                let remediation = diff.assessment?.remediation;
                if (!remediation && canReset && isVariantDiff && diff.nodeId) {
                  const property = diff.details?.property?.slice('variant.'.length);
                  const referenceValue = diff.details?.reference?.value;
                  if (
                    property &&
                    typeof referenceValue === 'string' &&
                    referenceValue.length
                  ) {
                    remediation = {
                      kind: 'set-variant-properties',
                      nodeId: diff.nodeId,
                      properties: {
                        [property]: referenceValue,
                      },
                    };
                  }
                }
                const resetDetail =
                  canReset && !remediation && diff.details
                    ? {
                        property: diff.details.property,
                        reference: diff.details.reference,
                        message: diff.message,
                      }
                    : null;

                if (existing) {
                  const sectionLines = isVariantDiff
                    ? existing.componentLines
                    : existing.layerLines;
                  sectionLines.push(line);
                  if (resetDetail) {
                    existing.details.push(resetDetail);
                  } else if (canReset && !remediation) {
                    existing.messages.push(diff.message);
                  }
                  if (
                    remediation &&
                    !existing.remediations.some(
                      (item) =>
                        item.kind === remediation.kind &&
                        item.nodeId === remediation.nodeId &&
                        JSON.stringify(item.properties) ===
                          JSON.stringify(remediation.properties),
                    )
                  ) {
                    existing.remediations.push(remediation);
                  }
                  return;
                }

                const group = {
                  id: groupId,
                  name: diff.nodeName || diff.nodePath || 'Слой',
                  nodePath: diff.nodePath || '',
                  order: groupsMap.size,
                  onFocus: diff.nodeId
                    ? () => focusNodeById(diff.nodeId)
                    : undefined,
                  nodeId: diff.nodeId,
                  componentLines: isVariantDiff ? [line] : [],
                  layerLines: isVariantDiff ? [] : [line],
                  messages:
                    canReset && !remediation && !resetDetail ? [diff.message] : [],
                  details: resetDetail ? [resetDetail] : [],
                  remediations: remediation ? [remediation] : [],
                };

                groupsMap.set(groupId, group);
              });

              const groups = sortCustomizationGroupsByPath(Array.from(groupsMap.values()))
                .map((group) => ({
                  id: group.id,
                  name: group.name,
                  onFocus: group.onFocus,
                  lines: [
                    ...(group.componentLines.length
                      ? [
                          {
                            label: 'Параметры компонента',
                            values: [],
                          },
                          ...group.componentLines,
                        ]
                      : []),
                    ...(group.layerLines.length
                      ? [
                          {
                            label: 'Параметры слоя',
                            values: [],
                          },
                          ...group.layerLines,
                        ]
                      : []),
                  ],
                  actions: buildCustomizationResetActions(item.id, group),
                  onReset:
                    (group.messages.length ||
                      group.details.length ||
                      group.remediations.length) &&
                    group.nodeId
                      ? () =>
                          requestCustomizationReset(
                            item.id,
                            group.nodeId,
                            group.messages,
                            group.details,
                            group.remediations,
                          )
                      : undefined,
                }));
              if (!groups.length) {
                return null;
              }

              return {
                kind: 'customization',
                id: item.id,
                title: item.name ?? 'Без названия',
                caption: getItemLibraryName(item) ?? undefined,
                groups,
              };
            })
            .filter(Boolean);

          if (!reactItems.length) {
            return false;
          }

          try {
            resultsBridge.showItems(reactItems);
            showReactResults();
            return true;
          } catch (error) {
            resultsBridgeMounted = false;
            console.error('[Apollo] results bridge update failed', error);
            hideReactResults();
            return false;
          }
        }

        function shouldUseAuditReactResults(tabId) {
          return (
            tabId === 'current' ||
            tabId === 'technical' ||
            tabId === 'deprecated' ||
            tabId === 'wrongChannel' ||
            tabId === 'update' ||
            tabId === 'presets' ||
            tabId === 'local'
          );
        }

        const TECHNICAL_DIFF_PATTERN = /(Token\s)|(token:)|(VariableID:)/i;

        function isTechnicalDiff(diff) {
          if (!diff || typeof diff.message !== 'string') return false;
          return TECHNICAL_DIFF_PATTERN.test(diff.message);
        }

        function getDiffKey(diff) {
          return (
            diff.nodeId ??
            diff.nodePath ??
            diff.nodeName ??
            String(diff.message ?? 'diff')
          );
        }

        function dedupeDiffs(diffs) {
          const seen = new Map();
          const normalized = [];
          for (const diff of diffs) {
            const key = getDiffKey(diff);
            const currentIsTech = isTechnicalDiff(diff);
            const existing = seen.get(key);
            if (existing) {
              const existingIsTech = isTechnicalDiff(existing.diff);
              if (!currentIsTech && existingIsTech) {
                normalized[existing.index] = diff;
                seen.set(key, { diff, index: existing.index });
                continue;
              }
              if (currentIsTech) {
                continue;
              }
            }
            const index = normalized.length;
            normalized.push(diff);
            seen.set(key, { diff, index });
          }
          return normalized;
        }

        /**
         * Убирает скрытые diff-ы и технические строки, оставляя человекочитаемые записи
         * для таба «Кастомизация» и рендерингового конца.
         */
        function prepareChangeDiffs(item) {
          const rawDiffs = Array.isArray(item.diffs) ? item.diffs : [];

          return dedupeDiffs(rawDiffs);
        }

        function setScanningState(active) {
          isScanning = active;
          actionPhase = active ? 'scanning' : getIdleActionPhase();
          refreshScanButton();
          updateLoaderVisibility();
        }

        function getIdleActionPhase() {
          if (catalogsLoading || !catalogsReady) {
            return 'catalog-loading';
          }
          return 'idle';
        }

        function getItemLibraryName(item) {
          if (item.librarySource) {
            return item.librarySource;
          }
          if (item.reference) {
            return item.reference.source ?? 'Дизайн-система';
          }
          if (item.isLocal) {
            return 'Локальный';
          }
          return null;
        }

        function formatCustomStyleReason(reason) {
          if (reason.startsWith('effect:')) {
            return reason.split(':')[1];
          }
          switch (reason) {
            case 'fill':
              return 'Заливка';
            case 'stroke':
              return 'Обводка';
            case 'style':
              return 'Стили';
            default:
              return 'Стиль';
          }
        }

        function formatDeprecatedStyleReason(reason) {
          switch (reason) {
            case 'fill':
              return 'Заливка';
            case 'stroke':
              return 'Обводка';
            default:
              return 'Стиль';
          }
        }

        function formatDeprecatedStyleSource(sourceFile) {
          if (!sourceFile) {
            return 'Unknown style catalog';
          }

          return sourceFile
            .replace(/^styles\//i, '')
            .replace(/\.json$/i, '');
        }

        function groupDeprecatedStyleEntries(items) {
          const groups = new Map();

          for (const entry of items) {
            const key = [
              entry.styleLabel || '',
              entry.sourceFile || '',
            ].join('|');

            if (!groups.has(key)) {
              groups.set(key, {
                id: key || entry.id,
                styleLabel: entry.styleLabel || 'Unknown style',
                sourceFile: entry.sourceFile || 'Unknown style catalog',
                sourceLibrary:
                  entry.sourceLibrary ||
                  entry.sourceFile ||
                  'Unknown style catalog',
                usages: [],
              });
            }

            groups.get(key).usages.push(entry);
          }

          return Array.from(groups.values());
        }

        window.onmessage = (event) => {
          const msg = event.data?.pluginMessage;
          if (!msg) return;

          if (msg.type === 'tab-config') {
            initializeTabConfig(msg.payload);
            return;
          }

          if (msg.type === 'scan-started') {
            listContainer.innerHTML = '';
            setScanningState(true);
            scanCompleted = false;
            agentReportMeta = null;
            agentLastSentReportId = null;
            agentRequestInProgress = false;
            agentActiveRequestId = null;
            agentMessages = [];
            agentChatOpen = false;
            syncAgentChatState();
            renderAgentMessages();
          }

          if (msg.type === 'scan-finished') {
            setScanningState(false);
            return;
          }

          if (msg.type === 'scan-cancelled') {
            setScanningState(false);
            showToast('Проверка остановлена');
            if (currentResults) {
              renderList();
            } else if (listContainer) {
              listContainer.innerHTML =
                '<div class="placeholder">Проверка остановлена.</div>';
            }
            return;
          }

          if (msg.type === 'scan-result') {
            currentResults = msg.payload;
            scanCompleted = true;
            syncAgentChatState();
            updateActiveTabClasses();
            renderList();
            showToast(
              `Проверено компонентов: ${currentResults.summary.totalTargets}`,
            );
            return;
          }

          if (msg.type === 'scan-error') {
            actionPhase = getIdleActionPhase();
            showToast(msg.payload?.message ?? 'Не удалось выполнить проверку');
            scanCompleted = false;
            agentReportMeta = null;
            agentChatOpen = false;
            syncAgentChatState();
            return;
          }

          if (msg.type === 'apollo-agent-report-ready') {
            agentReportMeta = msg.payload || null;
            syncAgentChatState();
            return;
          }

          if (msg.type === 'apollo-agent-started') {
            handleAgentStarted(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-result') {
            handleAgentResult(msg.payload || {});
            return;
          }

          if (msg.type === 'apollo-agent-cancelled') {
            agentRequestInProgress = false;
            agentActiveRequestId = null;
            syncAgentChatState();
            renderAgentMessages();
            return;
          }

          if (msg.type === 'catalog-file-loaded') {
            handleCatalogFileLoaded(msg.payload);
          }

          if (msg.type === 'catalog-loading') {
            catalogsLoading = true;
            catalogsReady = false;
            if (!isScanning) {
              actionPhase = 'catalog-loading';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showToast('Загружаем библиотеки…');
          }

          if (msg.type === 'catalog-ready') {
            catalogsLoading = false;
            catalogsReady = true;
            if (!isScanning) {
              actionPhase = 'idle';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showToast('Справочники загружены');
          }

          if (msg.type === 'catalog-error') {
            catalogsLoading = false;
            catalogsReady = false;
            if (!isScanning) {
              actionPhase = 'catalog-loading';
            }
            refreshScanButton();
            updateLoaderVisibility();
            showToast(
              msg.payload?.message ?? 'Не удалось загрузить справочники',
            );
          }
        };

        function showToast(message) {
          if (!toastEl) return;
          toastEl.textContent = message;
          toastEl.classList.add('visible');
          setTimeout(() => {
            toastEl?.classList.remove('visible');
          }, 3000);
        }

        function openAgentChat() {
          if (!scanCompleted) {
            return;
          }

          agentChatOpen = true;
          syncAgentChatState();

          if (!agentMessages.length) {
            addAgentMessage({
              role: 'user',
              text: agentReportMeta?.suggestedFileName
                ? `Отправить агенту отчёт ${agentReportMeta.suggestedFileName}`
                : 'Отправить агенту последний отчёт Apollo',
            });
          }

          if (!agentReportMeta) {
            addAgentMessage({
              role: 'error',
              text: 'Agent report ещё готовится. Попробуйте ещё раз через несколько секунд.',
            });
            return;
          }

          if (
            agentLastSentReportId !== agentReportMeta.reportId &&
            !agentRequestInProgress
          ) {
            sendAgentReportToProxy();
          }
        }

        function closeAgentChat() {
          agentChatOpen = false;
          syncAgentChatState();
        }

        function sendAgentReportToProxy() {
          if (!agentReportMeta || agentRequestInProgress) {
            return;
          }

          agentMessageSequence += 1;
          const requestId = `apollo-agent-${Date.now()}-${agentMessageSequence}`;
          agentActiveRequestId = requestId;
          agentRequestInProgress = true;
          syncAgentChatState();

          parent.postMessage(
            {
              pluginMessage: {
                type: 'send-apollo-agent-report',
                payload: { requestId },
              },
            },
            '*',
          );
        }

        function handleAgentStarted(payload) {
          if (payload.requestId && payload.requestId !== agentActiveRequestId) {
            agentActiveRequestId = payload.requestId;
          }
          agentRequestInProgress = true;
          ensureAgentUserMessage(payload);
          syncAgentChatState();

          replaceAgentLoadingMessage({
            role: 'assistant',
            variant: 'loading',
            text: 'Агент анализирует отчёт',
          });
        }

        function ensureAgentUserMessage(payload) {
          const hasUserMessage = agentMessages.some(
            (message) => message.role === 'user',
          );
          if (hasUserMessage) {
            return;
          }

          addAgentMessage({
            role: 'user',
            text: payload.suggestedFileName
              ? `Отправить агенту отчёт ${payload.suggestedFileName}`
              : agentReportMeta?.suggestedFileName
                ? `Отправить агенту отчёт ${agentReportMeta.suggestedFileName}`
                : 'Отправить агенту последний отчёт Apollo',
          });
        }

        function handleAgentResult(payload) {
          if (
            payload.requestId &&
            agentActiveRequestId &&
            payload.requestId !== agentActiveRequestId
          ) {
            return;
          }

          agentRequestInProgress = false;
          agentActiveRequestId = null;

          removeAgentLoadingMessage();

          if (payload.error) {
            addAgentMessage({
              role: 'error',
              text: payload.error,
            });
          } else {
            agentLastSentReportId =
              payload.reportId || agentReportMeta?.reportId || agentLastSentReportId;
            addAgentMessage({
              role: 'assistant',
              text: payload.text || 'Агент вернул пустой ответ.',
            });
          }

          syncAgentChatState();
        }

        function addAgentMessage(message) {
          agentMessageSequence += 1;
          agentMessages.push({
            id: `agent-message-${agentMessageSequence}`,
            ...message,
          });
          renderAgentMessages();
        }

        function replaceAgentLoadingMessage(message) {
          removeAgentLoadingMessage();
          addAgentMessage(message);
        }

        function removeAgentLoadingMessage() {
          agentMessages = agentMessages.filter(
            (message) => message.variant !== 'loading',
          );
          renderAgentMessages();
        }

        function renderAgentMessages() {
          if (!agentConversationInner) {
            return;
          }

          agentConversationInner.innerHTML = agentMessages
            .map((message) => renderAgentMessage(message))
            .join('');

          if (agentConversation) {
            agentConversation.scrollTop = agentConversation.scrollHeight;
          }
        }

        function renderAgentMessage(message) {
          if (message.role === 'user') {
            return `<article class="message-card user"><div class="user-msg"><div class="user-msg__stack"><div class="user-msg__line"><div class="user-msg__container">${buildMarkdownMessageMarkup(
              message.text || '',
            )}</div></div></div></div></article>`;
          }

          if (message.role === 'error') {
            return `<article class="message-card error"><div class="assistant-msg"><div class="assistant-msg__container error">${escapeHtml(
              message.text || '',
            )}</div></div></article>`;
          }

          if (message.variant === 'loading') {
            return `<article class="message-card assistant"><div class="assistant-msg"><div class="assistant-msg__container"><div class="assistant-copy">${escapeHtml(
              message.text || 'Агент анализирует отчёт',
            )}</div><div class="assistant-actions loading"><span class="spinner" aria-hidden="true"></span><span>LLM думает</span></div></div></div></article>`;
          }

          return `<article class="message-card assistant"><div class="assistant-msg"><div class="assistant-msg__container"><div class="assistant-copy">${buildMarkdownMessageMarkup(
            message.text || '',
          )}</div></div></div></article>`;
        }

        function syncAgentChatState() {
          if (agentChatFab) {
            agentChatFab.classList.toggle('visible', scanCompleted);
            agentChatFab.disabled = false;
          }
          if (agentChatOverlay) {
            agentChatOverlay.classList.toggle('visible', agentChatOpen);
            agentChatOverlay.setAttribute(
              'aria-hidden',
              agentChatOpen ? 'false' : 'true',
            );
          }
          if (agentChatMeta) {
            if (agentRequestInProgress) {
              agentChatMeta.textContent = 'Отправляем отчёт агенту';
            } else if (agentReportMeta?.suggestedFileName) {
              const count =
                typeof agentReportMeta.findingCount === 'number'
                  ? `, findings: ${agentReportMeta.findingCount}`
                  : '';
              agentChatMeta.textContent = `${agentReportMeta.suggestedFileName}${count}`;
            } else if (scanCompleted) {
              agentChatMeta.textContent = 'Agent report готовится';
            } else {
              agentChatMeta.textContent = 'Отчёт ещё не отправлен';
            }
          }
        }

        function buildMarkdownMessageMarkup(source) {
          const normalized = String(source || '').replace(/\r\n?/g, '\n').trim();
          if (!normalized) {
            return '';
          }
          return `<div class="markdown-root">${parseMarkdownBlocks(normalized)
            .map(renderMarkdownBlock)
            .join('')}</div>`;
        }

        function parseMarkdownBlocks(source) {
          const lines = source.split('\n');
          const blocks = [];
          let index = 0;

          while (index < lines.length) {
            const line = lines[index];
            const trimmed = line.trim();

            if (!trimmed) {
              index += 1;
              continue;
            }

            if (trimmed.startsWith('```')) {
              const code = [];
              index += 1;
              while (index < lines.length && !lines[index].trim().startsWith('```')) {
                code.push(lines[index]);
                index += 1;
              }
              if (index < lines.length) {
                index += 1;
              }
              blocks.push({ type: 'code', code: code.join('\n') });
              continue;
            }

            if (isMarkdownTableStart(lines, index)) {
              const tableLines = [lines[index], lines[index + 1]];
              index += 2;
              while (index < lines.length && isMarkdownTableRow(lines[index])) {
                tableLines.push(lines[index]);
                index += 1;
              }
              blocks.push(parseMarkdownTable(tableLines));
              continue;
            }

            const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
            if (heading) {
              blocks.push({
                type: 'heading',
                depth: heading[1].length,
                text: heading[2].trim(),
              });
              index += 1;
              continue;
            }

            if (/^-{3,}$/.test(trimmed)) {
              blocks.push({ type: 'divider' });
              index += 1;
              continue;
            }

            if (/^>\s?/.test(trimmed)) {
              blocks.push({
                type: 'quote',
                text: trimmed.replace(/^>\s?/, ''),
              });
              index += 1;
              continue;
            }

            const listMeta = getListMeta(trimmed);
            if (listMeta) {
              const items = [];
              const ordered = listMeta.ordered;
              while (index < lines.length) {
                const currentMeta = getListMeta(lines[index].trim());
                if (!currentMeta || currentMeta.ordered !== ordered) {
                  break;
                }
                items.push(currentMeta.content);
                index += 1;
              }
              blocks.push({ type: 'list', ordered, items });
              continue;
            }

            const paragraph = [trimmed];
            index += 1;
            while (index < lines.length) {
              const next = lines[index].trim();
              if (
                !next ||
                next.startsWith('```') ||
                /^(#{1,3})\s+/.test(next) ||
                /^[-*–—]\s+/.test(next) ||
                /^\d+[.)]\s+/.test(next) ||
                /^>\s?/.test(next) ||
                isMarkdownTableStart(lines, index)
              ) {
                break;
              }
              paragraph.push(next);
              index += 1;
            }
            blocks.push({ type: 'paragraph', text: paragraph.join(' ') });
          }

          return blocks;
        }

        function renderMarkdownBlock(block) {
          if (block.type === 'heading') {
            return `<div class="md-block md-block--h${block.depth}"><div class="md-h${block.depth}">${renderInlineMarkdown(
              block.text,
            )}</div></div>`;
          }
          if (block.type === 'paragraph') {
            return `<div class="md-block md-block--paragraph"><p class="md-p">${renderInlineMarkdown(
              block.text,
            )}</p></div>`;
          }
          if (block.type === 'quote') {
            return `<div class="md-block md-block--quote"><p class="md-quote">${renderInlineMarkdown(
              block.text,
            )}</p></div>`;
          }
          if (block.type === 'divider') {
            return '<div class="md-block md-block--divider"><div class="md-divider"></div></div>';
          }
          if (block.type === 'code') {
            return `<div class="md-block md-block--code"><pre class="md-pre"><code>${escapeHtml(
              block.code,
            )}</code></pre></div>`;
          }
          if (block.type === 'table') {
            const head = block.headers
              .map((header) => `<th class="md-th">${renderInlineMarkdown(header)}</th>`)
              .join('');
            const body = block.rows
              .map(
                (row) =>
                  `<tr class="md-tr">${row
                    .map((cell) => `<td class="md-td">${renderInlineMarkdown(cell)}</td>`)
                    .join('')}</tr>`,
              )
              .join('');
            return `<div class="md-block md-block--table"><div class="md-table-wrap"><div class="md-table-scroll"><table class="md-table"><thead><tr class="md-tr">${head}</tr></thead><tbody>${body}</tbody></table></div></div></div>`;
          }

          const items = block.items
            .map((item, index) => {
              const marker = block.ordered ? `${index + 1}.` : '–';
              const markerClass = block.ordered
                ? 'md-list-marker numbered'
                : 'md-list-marker';
              return `<div class="md-list-item"><div class="${markerClass}">${escapeHtml(
                marker,
              )}</div><div class="md-list-content">${renderInlineMarkdown(item)}</div></div>`;
            })
            .join('');
          return `<div class="md-block md-block--list"><div class="md-list">${items}</div></div>`;
        }

        function renderInlineMarkdown(source) {
          const pattern =
            /(\[[^\]]+\]\([^)]+\)|`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*)/g;
          let cursor = 0;
          let html = '';
          pattern.lastIndex = 0;
          let match = pattern.exec(source);
          while (match) {
            if (match.index > cursor) {
              html += renderPlainTextWithAutolinks(source.slice(cursor, match.index));
            }
            html += renderInlineToken(match[0]);
            cursor = match.index + match[0].length;
            match = pattern.exec(source);
          }
          if (cursor < source.length) {
            html += renderPlainTextWithAutolinks(source.slice(cursor));
          }
          return html;
        }

        function renderPlainTextWithAutolinks(source) {
          const urlPattern = /\bhttps?:\/\/[^\s<>()]+[^\s<>().,;:!?]/gi;
          let cursor = 0;
          let html = '';
          let match = urlPattern.exec(source);
          while (match) {
            const url = match[0];
            if (match.index > cursor) {
              html += escapeHtml(source.slice(cursor, match.index));
            }
            const escapedUrl = escapeHtml(url);
            html += `<a class="md-link" href="${escapedUrl}" target="_blank" rel="noreferrer">${escapedUrl}</a>`;
            cursor = match.index + url.length;
            match = urlPattern.exec(source);
          }
          if (cursor < source.length) {
            html += escapeHtml(source.slice(cursor));
          }
          return html;
        }

        function renderInlineToken(token) {
          const linkMatch = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
          if (linkMatch) {
            const href = escapeHtml(linkMatch[2]);
            return `<a class="md-link" href="${href}" target="_blank" rel="noreferrer">${renderInlineMarkdown(
              linkMatch[1],
            )}</a>`;
          }
          if (token.startsWith('`') && token.endsWith('`')) {
            return `<code class="md-code-inline">${escapeHtml(token.slice(1, -1))}</code>`;
          }
          if (token.startsWith('**') && token.endsWith('**')) {
            return `<strong class="md-strong">${renderInlineMarkdown(
              token.slice(2, -2),
            )}</strong>`;
          }
          if (token.startsWith('*') && token.endsWith('*')) {
            return `<em class="md-em">${renderInlineMarkdown(token.slice(1, -1))}</em>`;
          }
          return escapeHtml(token);
        }

        function isMarkdownTableStart(lines, index) {
          return (
            index + 1 < lines.length &&
            isMarkdownTableRow(lines[index]) &&
            isMarkdownTableSeparator(lines[index + 1])
          );
        }

        function isMarkdownTableRow(line) {
          const normalized = sanitizeMarkdownTableLine(line);
          return normalized.includes('|') && normalized.trim().startsWith('|');
        }

        function isMarkdownTableSeparator(line) {
          const cells = sanitizeMarkdownTableLine(line)
            .split('|')
            .slice(1, -1)
            .map((cell) => cell.trim());
          return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
        }

        function parseMarkdownTable(lines) {
          const headers = splitMarkdownTableRow(lines[0]);
          const rows = lines.slice(2).map((line) =>
            normalizeMarkdownTableCells(splitMarkdownTableRow(line), headers.length),
          );
          return { type: 'table', headers, rows };
        }

        function splitMarkdownTableRow(line) {
          return sanitizeMarkdownTableLine(line)
            .split('|')
            .slice(1, -1)
            .map((cell) => cell.trim());
        }

        function sanitizeMarkdownTableLine(line) {
          const trimmed = String(line || '').trim().replace(/\|\.\s*$/, '|');
          if (trimmed.startsWith('|') && !trimmed.endsWith('|')) {
            return `${trimmed} |`;
          }
          return trimmed;
        }

        function normalizeMarkdownTableCells(cells, count) {
          const normalized = cells.slice(0, count);
          while (normalized.length < count) {
            normalized.push('');
          }
          return normalized;
        }

        function getListMeta(line) {
          const orderedMatch = line.match(/^\s*(\d+)[.)]\s+(.+)$/);
          if (orderedMatch) {
            return { ordered: true, content: orderedMatch[2].trim() };
          }
          const unorderedMatch = line.match(/^\s*[-*–—]\s+(.+)$/);
          if (unorderedMatch) {
            return { ordered: false, content: unorderedMatch[1].trim() };
          }
          return null;
        }

        function escapeHtml(value) {
          return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function refreshScanButton() {
          syncChromeState();
        }

        function updateLoaderVisibility() {
          syncChromeState();
        }

        function handleCatalogFileLoaded(payload) {
          if (!payload?.name) return;
          showToast(`Скачан справочник: ${payload.name}`);
        }

        function handleScanActionPress() {
          if (isScanning) {
            parent.postMessage({ pluginMessage: { type: 'cancel-scan' } }, '*');
            return;
          }

          if (!catalogsReady) return;

          actionPhase = 'scanning';
          setScanningState(true);

          window.requestAnimationFrame(() => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: 'scan-selection',
                  payload: { pickerLabel: currentPickerLabel },
                },
              },
              '*',
            );
          });
        }

        function handlePickerChange(nextPickerLabel) {
          if (typeof nextPickerLabel !== 'string') {
            return;
          }

          const normalizedPickerLabel = nextPickerLabel.trim();
          if (!normalizedPickerLabel) {
            return;
          }

          currentPickerLabel = normalizedPickerLabel;
          const activeVisibleTab = getVisibleTabs().find(
            (tab) => tab.id === currentTab,
          );
          if (!activeVisibleTab && getVisibleTabs()[0]) {
            currentTab = getVisibleTabs()[0].id;
          }
          syncChromeState();
        }

        function applyCompactMode() {
          if (shellEl) {
            shellEl.classList.toggle('compact', isCompact);
          }
          if (workspaceEl) {
            workspaceEl.classList.toggle('compact', isCompact);
          }
          syncChromeState();
        }

        function toggleCompactMode() {
          setCompactMode(!isCompact);
        }

        function setCompactMode(nextCompact) {
          if (isCompact === nextCompact) {
            syncChromeState();
            return;
          }

          isCompact = nextCompact;
          applyCompactMode();
          parent.postMessage(
            {
              pluginMessage: {
                type: 'set-ui-compact',
                payload: { compact: nextCompact },
              },
            },
            '*',
          );
        }

        function handleTabSelection(tabId, count) {
          if (!count) {
            return;
          }

          if (isCompact) {
            setCompactMode(false);
          }

          setActiveTab(tabId);
        }

        function syncChromeState() {
          const tabs = getVisibleTabs().map((tab) => {
            const items = tab.source();
            const count = Array.isArray(items) ? items.length : 0;
            return {
              id: tab.id,
              title: tab.title,
              count,
              active: !isCompact && tab.id === currentTab,
              counterType: getCounterType(tab.id, count),
            };
          });

          const isActionScanning = actionPhase === 'scanning';
          const isActionCatalogLoading = actionPhase === 'catalog-loading';

          const chromeState = {
            title: 'Apollo',
            pickerLabel: currentPickerLabel,
            actionLabel: isActionScanning
              ? 'Остановить'
              : isActionCatalogLoading
                ? 'Загрузка каталогов...'
                : 'Проверить',
            actionDisabled: isActionCatalogLoading,
            actionLoading: isActionScanning || isActionCatalogLoading,
            actionType:
              isActionScanning || isActionCatalogLoading
                ? 'secondary'
                : 'primary',
            compact: isCompact,
            tabs,
          };

          if (chromeBridge && chromeBridgeMounted) {
            try {
              chromeBridge.update(chromeState);
              return;
            } catch (error) {
              chromeBridgeMounted = false;
              console.error('[Apollo] chrome bridge update failed', error);
            }
          }

          console.error('[Apollo] chrome bridge is unavailable');
        }

        function getCounterType(tabId, count) {
          if (!count) {
            return 'empty';
          }

          if (
            tabId === 'deprecated' ||
            tabId === 'themization' ||
            tabId === 'wrongChannel' ||
            tabId === 'deprecatedStyles' ||
            tabId === 'customStyles'
          ) {
            return 'error';
          }

          if (
            tabId === 'update' ||
            tabId === 'changes' ||
            tabId === 'local' ||
            tabId === 'detached'
          ) {
            return 'warning';
          }

          return 'general';
        }

        function getHiddenTabIds() {
          const hiddenFromResults = Array.isArray(currentResults?.ui?.hiddenTabIds)
            ? currentResults.ui.hiddenTabIds
            : [];
          const normalizedPicker = String(currentPickerLabel || '').trim().toLowerCase();
          const hiddenByPicker =
            normalizedPicker === 'ios' || normalizedPicker === 'android'
              ? ['themization']
              : [];
          return Array.from(new Set([...hiddenFromResults, ...hiddenByPicker]));
        }

        function getVisibleTabs() {
          const hiddenIds = new Set(getHiddenTabIds());
          return tabConfig.filter((tab) => !hiddenIds.has(tab.id));
        }
      })();
    </script>
  </body>
</html>
