<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        font:
          12px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #111;
        background: #eceff3;
      }
      .shell {
        position: relative;
        width: 800px;
        height: 860px;
        margin: 0 auto;
        background: #fff;
        border-radius: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .shell.compact {
        width: 400px;
      }

      .header {
        padding: 0;
        border-bottom: 1px solid #ececf2;
      }

      .results-pane {
        flex: 1;
        min-width: 0;
        max-height: 100%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #f3f4f7;
        padding: 12px;
        box-sizing: border-box;
      }
      #react-results {
        display: none;
      }
      .workspace {
        display: grid;
        grid-template-columns: 263px 1fr;
        gap: 8px;
        flex: 1;
        min-width: 0;
        min-height: 0;
      }
      .workspace.compact {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .workspace.agent-active {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .workspace.agent-active .sidebar {
        display: none;
      }
      .sidebar {
        width: 263px;
        padding: 12px;
        overflow-y: auto;
        max-height: 100%;
        box-sizing: border-box;
      }
      .workspace.compact .sidebar {
        width: 100%;
        padding-right: 12px;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .main.agent-active .results-pane {
        display: none !important;
      }
      .workspace.compact .main {
        display: none;
      }
      .workspace.compact.agent-active .main,
      .workspace.agent-active .main {
        display: flex;
      }
      .placeholder {
        padding: 24px;
        text-align: center;
        color: #999;
      }
      #toast {
        position: absolute;
        inset: auto auto 16px 16px;
        z-index: 25;
        max-width: 231px;
        box-sizing: border-box;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        background: #111827;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #toast.visible {
        opacity: 1;
      }
      .view-segmented-control {
        position: absolute;
        left: 50%;
        top: 12px;
        z-index: 12;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        border: 1px solid rgba(0, 0, 0, 0.04);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.04);
      }
      .view-segment {
        box-sizing: border-box;
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
        padding: 4px 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(3, 3, 6, 0.78);
        cursor: pointer;
        transition:
          background 0.16s ease,
          color 0.16s ease,
          box-shadow 0.16s ease;
      }
      .view-segment.active {
        background: #000;
        color: #fff;
        box-shadow: inset 0 0 0 1px #000;
      }
      .view-segment svg {
        width: 20px;
        height: 20px;
        display: block;
      }
      .view-segmented-control.compact {
        top: 16px;
      }
      .view-segmented-control.compact .view-segment {
        width: 32px;
        height: 32px;
        min-width: 32px;
        min-height: 32px;
        padding: 2px 6px;
      }
      .view-segmented-control.compact .view-segment svg {
        width: 20px;
        height: 20px;
      }
      .view-segment:disabled {
        cursor: default;
        opacity: 0.48;
      }
      .agent-chat-overlay {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: none;
        overflow: hidden;
        border-radius: 16px 16px 0 0;
        background: #f5f5f5;
      }
      .agent-chat-overlay.visible {
        display: flex;
      }
      .agent-chat-panel {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f5f5f5;
      }
      .agent-chat-panel::before {
        content: '';
        position: absolute;
        z-index: 1;
        top: 0;
        left: 0;
        width: min(100%, 376px);
        height: 48px;
        pointer-events: none;
        background: linear-gradient(180deg, #f5f5f5 0%, rgba(245, 245, 245, 0) 100%);
      }
      .agent-chat-panel,
      .agent-chat-panel *,
      .agent-chat-panel *::before,
      .agent-chat-panel *::after {
        box-sizing: border-box;
      }
      .agent-conversation {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        padding: 8px 20px 20px;
      }
      .workspace.compact .agent-conversation {
        padding-right: 12px;
        padding-left: 12px;
      }
      .agent-conversation-inner {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-width: 0;
      }
      .agent-conversation-inner.system-state-visible {
        align-items: center;
        justify-content: center;
      }
      .message-card {
        width: 100%;
        min-width: 0;
      }
      .message-card.system-state {
        width: min(100%, 420px);
      }
      .agent-system-state {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .agent-system-state__graphic {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 28px;
        background: rgba(38, 55, 88, 0.06);
        color: rgba(3, 3, 6, 0.88);
      }
      .agent-system-state__graphic svg {
        width: 48px;
        height: 48px;
        display: block;
      }
      .agent-system-state__title {
        width: 100%;
        padding-bottom: 16px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 22px;
        line-height: 26px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .agent-system-state__subtitle {
        width: 100%;
        padding-bottom: 12px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 16px;
        line-height: 24px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .agent-system-state__retry {
        min-height: 40px;
        margin-top: 12px;
        padding: 8px 18px;
        border: 0;
        border-radius: 999px;
        background: #000;
        color: rgba(255, 255, 255, 0.94);
        font: inherit;
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        letter-spacing: 0;
        cursor: pointer;
      }
      .agent-system-state__retry:hover {
        background: rgba(3, 3, 6, 0.88);
      }
      .message-card.user {
        padding: 0;
      }
      .user-msg {
        display: flex;
        width: 100%;
        min-width: 0;
        padding: 12px 0 16px;
      }
      .user-msg__stack {
        display: flex;
        width: 100%;
        min-width: 0;
        flex-direction: column;
        align-items: flex-end;
      }
      .user-msg__line {
        display: flex;
        width: 100%;
        min-width: 0;
        justify-content: flex-end;
      }
      .user-msg__container {
        width: fit-content;
        max-width: min(100%, 400px);
        min-width: 0;
        border-radius: 14px 14px 6px 14px;
        background: #fff;
        padding: 12px 16px;
        color: rgba(3, 3, 6, 0.88);
        font-size: 14px;
        line-height: 20px;
        overflow-wrap: anywhere;
      }
      .assistant-msg {
        display: flex;
        width: 100%;
        min-width: 0;
        padding: 12px 0 16px;
      }
      .assistant-msg__container {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        color: rgba(3, 3, 6, 0.88);
      }
      .assistant-msg__container.error {
        color: #c33d2f;
      }
      .assistant-copy {
        position: relative;
        width: 100%;
        max-width: 100%;
        color: inherit;
        font-size: 15px;
        line-height: 22px;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }
      .assistant-actions.loading {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: rgba(5, 8, 29, 0.45);
        font-size: 13px;
        line-height: 18px;
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(30, 43, 68, 0.16);
        border-top-color: rgba(3, 3, 6, 0.72);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .agent-composer {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        min-height: 56px;
        width: 100%;
        margin: 0;
        border-top: 1px solid #e7e7e7;
        border-radius: 0 0 16px 16px;
        background: #f5f5f5;
        overflow: hidden;
      }
      .agent-composer.hidden {
        display: none;
      }
      .agent-composer-input {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        min-height: 56px;
        max-height: 196px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 18px 52px 18px 20px;
        color: rgba(3, 3, 6, 0.88);
        font: inherit;
        font-size: 15px;
        line-height: 20px;
        letter-spacing: 0;
        caret-color: rgba(3, 3, 6, 0.88);
      }
      .agent-composer-input::placeholder {
        color: rgba(5, 8, 29, 0.38);
        -webkit-text-fill-color: rgba(5, 8, 29, 0.38);
      }
      .agent-composer-input:disabled {
        color: rgba(5, 8, 29, 0.38);
        opacity: 1;
        -webkit-text-fill-color: rgba(5, 8, 29, 0.38);
      }
      .agent-input-addon {
        position: absolute;
        z-index: 3;
        right: 10px;
        bottom: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .agent-input-addon[disabled] {
        cursor: default;
        opacity: 0.36;
      }
      .agent-input-addon.hidden {
        display: none;
      }
      .agent-input-addon svg {
        display: block;
        width: 24px;
        height: 24px;
      }
      .agent-input-addon .agent-stop-icon,
      .agent-input-addon.is-stop .agent-send-icon {
        display: none;
      }
      .agent-input-addon.is-stop .agent-stop-icon {
        display: block;
      }
      .markdown-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-width: 0;
      }
      .md-block {
        width: 100%;
        min-width: 0;
      }
      .md-block--h1,
      .md-block--paragraph,
      .md-block--quote,
      .md-block--list {
        padding-bottom: 12px;
      }
      .md-block--h2 {
        padding: 24px 0 14px;
      }
      .md-block--h3,
      .md-block--h4,
      .md-block--h5,
      .md-block--h6,
      .md-block--divider,
      .md-block--table,
      .md-block--code {
        padding: 14px 0 12px;
      }
      .md-block:first-child {
        padding-top: 0;
      }
      .md-block:last-child {
        padding-bottom: 0;
      }
      .md-h1,
      .md-h2,
      .md-h3,
      .md-h4,
      .md-h5,
      .md-h6,
      .md-p,
      .md-quote,
      .md-list-content,
      .md-th,
      .md-td,
      .md-pre {
        margin: 0;
      }
      .md-h1 {
        font-size: 20px;
        line-height: 26px;
        font-weight: 700;
      }
      .md-h2 {
        font-size: 17px;
        line-height: 24px;
        font-weight: 700;
      }
      .md-h3 {
        font-size: 15px;
        line-height: 22px;
        font-weight: 700;
      }
      .md-h4,
      .md-h5,
      .md-h6 {
        font-size: 14px;
        line-height: 20px;
        font-weight: 700;
      }
      .md-p,
      .md-list-content,
      .md-th,
      .md-td,
      .md-pre {
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        color: inherit;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .md-quote {
        padding-left: 16px;
        border-left: 4px solid rgba(30, 43, 68, 0.12);
        font-size: 15px;
        line-height: 22px;
        font-style: italic;
        font-weight: 600;
        color: rgba(5, 8, 29, 0.78);
        white-space: pre-wrap;
      }
      .md-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .md-list-item {
        display: flex;
        align-items: flex-start;
      }
      .md-list-marker {
        width: 22px;
        flex: 0 0 22px;
        padding-right: 6px;
        text-align: right;
        font-size: 14px;
        line-height: 20px;
      }
      .md-list-marker.numbered {
        text-align: left;
        font-variant-numeric: tabular-nums;
      }
      .md-list-content {
        flex: 1 1 auto;
        min-width: 0;
      }
      .md-divider {
        width: 100%;
        height: 1px;
        background: #e7e8eb;
      }
      .md-table-wrap {
        width: 100%;
        max-width: 100%;
        border: 1px solid #e7e8eb;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.7);
        overflow: hidden;
      }
      .md-table-scroll {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .md-table {
        width: max-content;
        min-width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }
      .md-th,
      .md-td {
        min-width: 96px;
        max-width: 240px;
        padding: 10px 12px;
        vertical-align: top;
        text-align: left;
        font-size: 13px;
        line-height: 18px;
        white-space: normal;
        word-break: normal;
        overflow-wrap: anywhere;
      }
      .md-th {
        font-weight: 700;
        background: rgba(30, 43, 68, 0.06);
      }
      .md-tr + .md-tr .md-td,
      .md-tr + .md-tr .md-th {
        border-top: 1px solid #e7e8eb;
      }
      .md-th + .md-th,
      .md-td + .md-td {
        border-left: 1px solid #e7e8eb;
      }
      .md-pre {
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(30, 43, 68, 0.12);
        background: rgba(3, 3, 6, 0.86);
        color: rgba(255, 255, 255, 0.88);
        overflow-x: auto;
        max-width: 100%;
        white-space: pre;
        word-break: normal;
        overflow-wrap: normal;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .md-code-inline {
        padding: 1px 5px;
        border-radius: 6px;
        background: rgba(30, 43, 68, 0.08);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.95em;
      }
      .md-strong {
        font-weight: 700;
      }
      .md-em {
        font-style: italic;
      }
      .md-link {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- ui-app-css -->
  </head>

  <body>
    <div class="shell">
      <header class="header">
        <div id="react-top-section"></div>
      </header>
      <div class="workspace">
        <aside class="sidebar">
          <div id="react-left-section"></div>
        </aside>
        <main class="main">
          <div id="react-results" class="results-pane"></div>
          <div id="results" class="results-pane placeholder">
            Начните со сканирования.
          </div>
          <section
            id="agent-chat-overlay"
            class="agent-chat-overlay"
            aria-hidden="true"
          >
            <div class="agent-chat-panel" role="region" aria-label="Apollo agent">
              <section id="agent-conversation" class="agent-conversation" aria-live="polite">
                <div id="agent-conversation-inner" class="agent-conversation-inner"></div>
              </section>
              <form id="agent-composer" class="agent-composer">
                <textarea
                  id="agent-composer-input"
                  class="agent-composer-input"
                  rows="1"
                  placeholder="Введи или выбери текст"
                ></textarea>
                <button
                  id="agent-composer-submit"
                  type="submit"
                  class="agent-input-addon hidden"
                  aria-label="Отправить агенту"
                >
                  <svg class="agent-send-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" fill="#212124"></circle>
                    <path d="M12 15.5V8.5M12 8.5L9.25 11.25M12 8.5L14.75 11.25" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                  <svg class="agent-stop-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="10" fill="#212124"></circle>
                    <path d="M8.75 8.75L15.25 15.25M15.25 8.75L8.75 15.25" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"></path>
                  </svg>
                </button>
              </form>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div id="toast"></div>
    <div class="view-segmented-control" aria-label="Вид Apollo">
      <button
        id="agent-table-fab"
        class="view-segment active"
        type="button"
        aria-label="Показать таблицу"
        aria-pressed="true"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <rect
            x="3.75"
            y="3.75"
            width="12.5"
            height="12.5"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M8 3.75v12.5M3.75 8h12.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button
        id="agent-report-fab"
        class="view-segment"
        type="button"
        aria-label="Показать отчёт агента"
        aria-pressed="false"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M6 2.75h5.25l3.25 3.25v10.25a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.75a1 1 0 0 1 1-1Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
          <path
            d="M11.25 2.75V6h3.25M7.5 9h5M7.5 11.75h5M7.5 14.5h3.25"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        id="agent-chat-fab"
        class="view-segment"
        type="button"
        aria-label="Открыть диалог с агентом"
        aria-pressed="false"
      >
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M10 3.25C6.27 3.25 3.25 5.82 3.25 9c0 1.54.72 2.94 1.88 3.98l-.55 2.28 2.55-1.18c.86.42 1.84.67 2.87.67 3.73 0 6.75-2.57 6.75-5.75S13.73 3.25 10 3.25Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M7.25 8.25h5.5M7.25 10.75h4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>
    <script src="./ui-app.js"></script>
    <script>
      (function () {
        let tabConfig = [];
        let leftSectionOrder = [
          'themization',
          'wrongChannel',
          'technical',
          'deprecated',
          'deprecatedStyles',
          'customStyles',
          '__divider_after_customStyles__',
          'update',
          'changes',
          'local',
          'detached',
          '__divider_after_detached__',
          'presets',
          'current',
        ];

        function initializeTabConfig(payload) {
          const definitions = Array.isArray(payload)
            ? payload
            : Array.isArray(payload?.definitions)
              ? payload.definitions
              : null;
          if (!definitions) return;

          if (Array.isArray(payload?.leftSectionOrder)) {
            leftSectionOrder = payload.leftSectionOrder.slice();
          }

          tabConfig = definitions
            .map((definition) => {
              const source = getTabSource(definition.id);
              if (!source) return null;
              return {
                ...definition,
                source,
              };
            })
            .filter(Boolean);
          renderTabs();
          const target =
            getVisibleTabs().find((tab) => tab.id === currentTab) ??
            getVisibleTabs()[0] ??
            tabConfig[0];
          if (target) {
            setActiveTab(target.id);
          }
        }

        function getValueFromPath(source, path) {
          if (!source || !Array.isArray(path)) return undefined;
          let current = source;
          for (const key of path) {
            if (!current || typeof current !== 'object') {
              return undefined;
            }
            current = current[key];
          }
          return current;
        }

        function resolveViewArray(path) {

        function requestCustomizationReset(
          rootId,
          nodeId,
          messages,
          details = [],
          remediations = [],
        ) {
          if (
            !rootId ||
            !nodeId ||
            (!Array.isArray(messages) &&
              !Array.isArray(details) &&
              !Array.isArray(remediations)) ||
            (!messages.length && !details.length && !remediations.length)
          ) {
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: 'reset-customization-group',

                  rootId,
                  nodeId,
                  messages,
                  details,
                  remediations,
                },

            },
            '*',
          );
        }

        function buildCustomizationResetActions(rootId, group) {
          if (!rootId || !group?.nodeId) {
            return [];
          }

          const actions = [];
          const hasComponentProperties =
            Array.isArray(group.remediations) && group.remediations.length > 0;
          const hasLayerProperties =
            (Array.isArray(group.details) && group.details.length > 0) ||
            (Array.isArray(group.messages) && group.messages.length > 0);

          if (hasComponentProperties && hasLayerProperties) {
            const allMessages = [
              ...(Array.isArray(group.messages) ? group.messages : []),
              ...(Array.isArray(group.details)
                ? group.details
                    .map((detail) => detail?.message)
                    .filter((message) => typeof message === 'string' && message.length)
                : []),
            ];
            actions.push({
              label: 'Сбросить всё',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  allMessages,
                  [],
                  group.remediations,
                ),
            });
          }

          if (hasComponentProperties) {
            actions.push({
              label: 'Параметры',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  [],
                  [],
                  group.remediations,
                ),
            });
          }

          if (hasLayerProperties) {
            actions.push({
              label: 'Слой',
              singleIcon: false,
              onPress: () =>
                requestCustomizationReset(
                  rootId,
                  group.nodeId,
                  group.messages,
                  group.details,
                  [],
                ),
            });
          }

          return actions;
        }

        function sortCustomizationGroupsByPath(groups) {
          return groups
            .map((group) => ({
              group,
              order: getCustomizationGroupSortOrder(group, groups),
            }))
            .sort((left, right) => compareCustomizationGroupSortEntries(left, right))
            .map((entry) => entry.group);
        }

        function compareCustomizationGroupSortEntries(leftEntry, rightEntry) {
          const left = leftEntry.group;
          const right = rightEntry.group;
          const leftPath = getCustomizationGroupPath(left);
          const rightPath = getCustomizationGroupPath(right);
          if (leftEntry.order !== rightEntry.order) {
            return leftEntry.order - rightEntry.order;
          }
          if (leftPath === rightPath) {
            return (left?.order ?? 0) - (right?.order ?? 0);
          }
          if (isAncestorPath(leftPath, rightPath)) {
            return -1;
          }
          if (isAncestorPath(rightPath, leftPath)) {
            return 1;
          }

          return (left?.order ?? 0) - (right?.order ?? 0);
        }

        function getCustomizationGroupSortOrder(group, groups) {
          const groupPath = getCustomizationGroupPath(group);
          let order = group?.order ?? 0;
          groups.forEach((candidate) => {
            const candidatePath = getCustomizationGroupPath(candidate);
            if (isAncestorPath(groupPath, candidatePath)) {
              order = Math.min(order, candidate?.order ?? order);
            }
          });
          return order;
        }

        function getCustomizationGroupPath(group) {
          return String(group?.nodePath || group?.name || '');
        }

        function isAncestorPath(parentPath, childPath) {
          if (!parentPath || !childPath || parentPath === childPath) {
            return false;
          }
          return childPath.indexOf(`${parentPath} / `) === 0;
        }
