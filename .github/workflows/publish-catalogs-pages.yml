name: Publish Apollo catalogs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-catalogs-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog source
        uses: actions/checkout@v4
        with:
          repository: Ackedze/design-system_ab
          token: ${{ secrets.CATALOGS_REPO_TOKEN }}
          path: catalog-source

      - name: Prepare static catalog site
        run: |
          mkdir -p _site
          cp -R catalog-source/JSONS _site/JSONS
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy catalogs
        id: deployment
        uses: actions/deploy-pages@v4
